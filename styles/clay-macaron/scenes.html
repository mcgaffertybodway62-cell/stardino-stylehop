<!--
  Clay Macaron · Pure 3D Stop-Motion Timeline (`styles/clay-macaron/scenes.html`).

  AI Authoring Contract:
  1. Pure 3D Visual Stage by Default:
     In `clay-macaron`, the 3D stop-motion animation (`world.js`) IS the video.
     Keep `<section class="frame scene">` containers free of developer inspection plaques,
     parameter cards, or floating UI badges unless the user explicitly asks for subtitles/titles.
  2. Frame-Accurate Sound Foley (`data-cues`):
     Each `<section>` declares `data-cues="offsetSec:kind:label:intensity, ..."` synced to the
     3D physical impacts, pours, springs, and hops in `world.js` so `tools/sound.py` synthesizes
     a matched 48kHz `clay` soundtrack.
  3. Timing & light belong to the story, not to a template:
     `data-dur` differs per scene (a beat can be 2s or 6s); there can be 2 scenes or 7.
     `data-look="golden|dusk|night|indoor|day"` (+ optional `data-look-blend="sec"`,
     `data-look-at="sec"`) changes the light per scene through `engine/look.js`.
     Cuts inside a scene are a shot list in world.js (`studio.director`).
-->
