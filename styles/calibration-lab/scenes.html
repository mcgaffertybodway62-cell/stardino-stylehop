<!--
  Calibration Lab · Pure 3D Timeline (`styles/calibration-lab/scenes.html`).

  Authoring contract:
  1. Pure 3D visual stage: the 3D sample (`world.js`) IS the video. Every `<section>` stays free of
     inspection plaques, parameter cards or floating UI badges; the instrument readouts are drawn
     inside the 3D frame by the kernel HUD (`kernel.js -> createGaugeHud`).
  2. Four scenes, four jobs: run → section → explode → measurement. Durations belong to the story,
     not to a template; keep the job of each scene, not its exact length.
  3. `data-cues` use the engine foley kinds (brass_ratchet / scale_tilt / card_enter / count_tick),
     aligned with the crank pass, the cut sweep and the layer separations in `world.js`.
-->
