<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>World 03 · Cyber Train Parkour · 18s Story Render Stage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #05060f;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }
    #overlay-2d {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <!-- Three.js 与后处理管线 (与 index.html 严格一致) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <canvas id="overlay-2d" width="1920" height="1080"></canvas>

  <!-- 2D 漫画横切刀锋眼特写已由 10_story_director_18s.js drawDynamicBladeEyeCutIn() 实时程序化绘制 -->

  <!-- 隐藏所有交互 HUD DOM 节点，防止 08_camera_and_loop.js 报错 -->
  <div id="hud-dom-placeholders" style="display:none;">
    <div id="hud-readout"></div>
    <div id="zone-indicator"></div>
    <div id="optical-lens-overlay"></div>
    <div id="hud-top-bar"></div>
    <div id="hud-bottom-bar"></div>
    <button id="holo-both"></button>
    <button id="holo-earth"></button>
    <button id="holo-island"></button>
    <button id="style-neon"></button>
    <button id="style-cyberwire"></button>
    <button id="style-clay"></button>
    <button id="cam-pov"></button>
    <button id="cam-chase"></button>
    <button id="cam-curve"></button>
    <button id="cam-orbit"></button>
    <input id="rng-car" type="range" value="7" />
    <span id="lbl-car"></span>
    <input id="rng-fov" type="range" value="78" />
    <span id="lbl-fov"></span>
    <input id="rng-bloom" type="range" value="100" />
    <span id="lbl-bloom"></span>
    <input id="rng-fog" type="range" value="100" />
    <span id="lbl-fog"></span>
    <input id="rng-speed" type="range" value="1.0" />
    <span id="lbl-speed"></span>
  </div>

  <!-- 拦截自动 RAF 循环，由 10_story_director_18s.js 进行确定性逐帧 stepFrame(t) 控制 -->
  <script>
    window.__RENDER_STAGE_MODE__ = true;
    window.__origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      if (window.__RENDER_STAGE_MODE__) return 0;
      return window.__origRAF(cb);
    };
  </script>

  <!-- 顺序加载场景模块 -->
  <script src="01_core_and_lights.js"></script>
  <script src="02_shaders_and_textures.js"></script>
  <script src="03_materials.js"></script>
  <script src="04_tracks_and_bridges.js"></script>
  <script src="05_city_architecture.js"></script>
  <script src="06_holo_wonders_and_cars.js"></script>
  <script src="07_trains_and_particles.js"></script>
  <script src="08_camera_and_loop.js"></script>
  <script src="09_slime_3d_asset.js"></script>

  <!-- 18.0s 六幕导演编排控制脚本 -->
  <script src="10_story_director_18s.js"></script>
</body>
</html>
