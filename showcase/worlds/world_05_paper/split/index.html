<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World 04 · 纸雕立体书山谷 — 全景 3D 翻页剧场与外部资产库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../engine/vendor/three.min.js"></script>
  <script>
    if (typeof THREE !== 'undefined' && !THREE.PlaneBufferGeometry) {
      THREE.PlaneBufferGeometry = THREE.PlaneGeometry;
      THREE.BoxBufferGeometry = THREE.BoxGeometry;
      THREE.CylinderBufferGeometry = THREE.CylinderGeometry;
      THREE.SphereBufferGeometry = THREE.SphereGeometry;
      THREE.ConeBufferGeometry = THREE.ConeGeometry;
      THREE.TorusBufferGeometry = THREE.TorusGeometry;
      THREE.CircleBufferGeometry = THREE.CircleGeometry;
      THREE.RingBufferGeometry = THREE.RingGeometry;
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="w-screen h-screen relative select-none overflow-hidden">

  <!-- Full-Screen Three.js WebGL Panoramic Stage -->
  <div id="canvas-container" class="w-full h-full absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- Minimalist Top Header -->
  <header class="absolute top-3 left-4 right-4 z-20 flex items-center justify-between gap-2 pointer-events-none">
    <div class="glass-panel rounded-2xl px-3.5 py-1.5 flex items-center gap-2.5 pointer-events-auto">
      <div class="w-7 h-7 rounded-lg gold-badge flex items-center justify-center text-amber-300 font-bold text-sm">✦</div>
      <div class="flex items-center gap-2">
        <h1 class="serif-title text-sm sm:text-base font-bold text-amber-100">World 04 · 纸雕立体书山谷</h1>
        <span id="hud-fps" class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">60 FPS</span>
      </div>
    </div>

    <div class="glass-panel rounded-2xl p-1 flex items-center gap-1 pointer-events-auto">
      <button id="btn-mode-stage" class="px-3 py-1.5 rounded-xl text-xs transition-all active-tab flex items-center gap-1">
        <span>🎬</span>
        <span>剧场动画</span>
      </button>
      <button id="btn-mode-studio" class="px-3 py-1.5 rounded-xl text-xs text-amber-100/80 hover:text-amber-100 hover:bg-white/5 transition-all flex items-center gap-1">
        <span>🧩</span>
        <span>独立资产库 (9项)</span>
      </button>
      <button id="btn-cam-toggle" class="px-2.5 py-1.5 rounded-xl text-xs text-amber-200 hover:bg-white/10 transition flex items-center gap-1" title="切换全景立体书机位 / 近景跟随运镜">
        <span>🖼️</span>
        <span id="cam-badge">全景立体书视角</span>
      </button>
      <button id="btn-audio-toggle" class="px-2.5 py-1.5 rounded-xl text-xs text-amber-200 hover:bg-white/10 transition flex items-center gap-1">
        <span id="audio-icon">🔇</span>
        <span id="audio-label" class="hidden sm:inline">开启音效</span>
      </button>
      <button id="btn-open-code-modal" class="px-2.5 py-1.5 rounded-xl text-xs text-amber-200 border border-amber-400/30 hover:bg-amber-400/15 transition flex items-center gap-1">
        <span>📦</span>
        <span class="hidden md:inline">获取代码</span>
      </button>
    </div>
  </header>

  <!-- Subtle Cinema Subtitle Caption -->
  <div id="subtitle-banner" class="absolute bottom-24 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-11/12 max-w-2xl text-center">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-2xl glass-panel border border-amber-300/30 shadow-xl">
      <span id="subtitle-emoji" class="text-base">✦</span>
      <span id="hud-desc" class="text-xs sm:text-sm font-medium text-amber-50 tracking-wide">
        第一幕 · 星芒点亮峡谷灯笼先行飞往下一页，史莱姆在断崖高台苏醒追赶…
      </span>
    </div>
  </div>

  <!-- Sleek Bottom Timeline & 6-Beat Chapter Bar (24.0s Full Finely-Detailed Storyboard) -->
  <footer class="absolute bottom-3 left-4 right-4 z-20 pointer-events-none">
    <div class="glass-panel rounded-2xl px-4 py-2 pointer-events-auto max-w-5xl mx-auto flex flex-col gap-1.5">
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-1 text-[11px]" id="story-beats-list">
        <button data-time="0.2" class="beat-btn chapter-pill-active px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          1. 星飞追赶 ✦
        </button>
        <button data-time="4.3" class="beat-btn px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          2. 谷底交流 ♪
        </button>
        <button data-time="7.9" class="beat-btn px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          3. 缓升跳乘 🕊️
        </button>
        <button data-time="14.9" class="beat-btn px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          4. 翻页见星 📖
        </button>
        <button data-time="18.7" class="beat-btn px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          5. 右降致谢 ♥
        </button>
        <button data-time="25.1" class="beat-btn px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-amber-100/80 hover:bg-white/10 transition truncate">
          6. 摘星入亭 🎠
        </button>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-play-pause" class="w-8 h-8 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold flex items-center justify-center shadow transition shrink-0">
          <span id="play-icon">⏸</span>
        </button>

        <div class="flex-1 flex items-center gap-2.5">
          <span id="time-current" class="text-xs font-mono text-amber-300 font-semibold w-12 shrink-0">00.00s</span>
          <input id="slider-timeline" type="range" min="0" max="30" step="0.02" value="0" class="w-full" />
          <span class="text-xs font-mono text-amber-200/50 w-12 shrink-0 text-right">30.00s</span>
        </div>

        <div class="hidden sm:flex items-center gap-1.5 shrink-0">
          <select id="select-speed" class="bg-black/40 border border-amber-300/30 rounded-lg px-2 py-1 text-xs text-amber-100 outline-none">
            <option value="0.5">0.5x 慢放</option>
            <option value="1.0" selected>1.0x 唯美原速</option>
            <option value="1.25">1.25x 轻快</option>
            <option value="1.6">1.6x 快节奏</option>
          </select>
          <button id="btn-snap-keyframe" class="px-2.5 py-1 rounded-lg text-xs font-medium gold-badge text-amber-200 hover:bg-amber-400/30 transition">
            ★ 跳上纸鹤帧
          </button>
          <button id="btn-reset-view" class="px-2 py-1 rounded-lg text-xs text-amber-200/80 hover:text-amber-100 hover:bg-white/10 transition">
            重置机位
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Slide-over Studio Drawer (Only visible when "独立资产库 (9项)" is clicked) -->
  <aside id="left-panel" class="absolute top-16 left-4 bottom-24 w-72 z-20 pointer-events-none hidden">
    <div id="sidebar-studio" class="glass-panel rounded-2xl p-3.5 flex flex-col gap-2.5 max-h-full overflow-y-auto pointer-events-auto">
      <div class="flex items-center justify-between border-b border-amber-300/15 pb-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-300">🧩 独立 3D 纸雕外部资产</span>
        <span class="text-[11px] text-amber-200/60">点击切换</span>
      </div>
      <div id="asset-list" class="grid grid-cols-1 gap-1 text-xs">
        <button data-asset="slime" class="asset-card asset-card-active p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>1. 五层模切彩纸史莱姆 (Slime)</span><span>💧</span>
        </button>
        <button data-asset="crane_lead" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>2. 经典3D几何折纸千纸鹤 (三色编队)</span><span>🕊️</span>
        </button>
        <button data-asset="star" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>3. 八面宝石金箔星芒 ✦ &amp; 纸灯笼星</span><span>✦</span>
        </button>
        <button data-asset="lantern" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>4. 红金折纸宫灯 (Paper Lantern)</span><span>🏮</span>
        </button>
        <button data-asset="zoetrope" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>5. 折纸走马灯小亭 (Zoetrope Pavilion)</span><span>🎠</span>
        </button>
        <button data-asset="sun" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>6. 四层同心圆暖金模切日轮 (Paper Sun)</span><span>☀️</span>
        </button>
        <button data-asset="pagoda_pine" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>7. 五层纸雕古塔与折纸松树</span><span>🏯</span>
        </button>
        <button data-asset="pedestal" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>8. 立体书中央折纸底座与支撑卡榫</span><span>📐</span>
        </button>
        <button data-asset="book_stage" class="asset-card p-2 rounded-xl bg-white/5 border border-white/10 text-left transition flex items-center justify-between">
          <span>9. 完整红布精装立体书舞台外框</span><span>📕</span>
        </button>
      </div>

      <div class="bg-black/35 rounded-xl p-2 space-y-1.5 border border-amber-200/10 text-xs">
        <div class="flex justify-between">
          <span class="text-amber-100/80">纸层拆解间距</span>
          <span id="val-explode" class="text-amber-300 font-mono">1.0x</span>
        </div>
        <input id="slider-explode" type="range" min="0.5" max="3.0" step="0.05" value="1.0" class="w-full" />
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-1 cursor-pointer text-amber-100/80">
            <input id="chk-turntable" type="checkbox" checked class="accent-amber-400" />
            <span>自动旋转</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer text-amber-100/80">
            <input id="chk-wireframe" type="checkbox" class="accent-amber-400" />
            <span>线框</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-1.5">
        <button id="btn-export-obj" class="px-2 py-1.5 rounded-xl text-xs font-semibold bg-amber-400/20 hover:bg-amber-400/30 border border-amber-300/50 text-amber-100 transition">⬇️ 导出 .OBJ</button>
        <button id="btn-export-json" class="px-2 py-1.5 rounded-xl text-xs font-semibold bg-amber-400/20 hover:bg-amber-400/30 border border-amber-300/50 text-amber-100 transition">📄 导出 .JSON</button>
        <button id="btn-snapshot-png" class="col-span-2 px-2 py-1.5 rounded-xl text-xs font-semibold gold-badge text-amber-100 hover:bg-amber-400/30 transition">🖼️ 下载当前视角高清 PNG</button>
      </div>
    </div>

    <!-- Hidden compatibility container -->
    <div id="sidebar-stage" class="hidden">
      <span id="hud-title"></span>
      <span id="telemetry-slime"></span>
      <span id="telemetry-lanterns"></span>
      <span id="telemetry-cranes"></span>
      <span id="telemetry-zoetrope"></span>
      <span id="timeline-act-label"></span>
      <span id="val-fold"></span>
      <input id="slider-fold" type="range" min="0" max="1" step="0.01" value="1" />
      <span id="val-eye-mode"></span>
      <input id="chk-creases" type="checkbox" checked />
      <button id="btn-ignite-all" type="button">🏮 全亮灯笼</button>
      <button data-cam="keyframe" class="cam-btn" type="button">📸 v5 经典关键帧 (9.8s)</button>
      <button data-cam="director" class="cam-btn" type="button">🎥 15s 导演跟随运镜</button>
      <button data-cam="orbit" class="cam-btn" type="button">🌐 自由 3D 环绕检视</button>
      <button data-cam="zoetrope" class="cam-btn" type="button">🏮 走马灯内部彩窗视角</button>
      <button data-eye="pill" class="eye-btn" type="button">I I</button>
      <button data-eye="blink" class="eye-btn" type="button">– –</button>
      <button data-eye="focus" class="eye-btn" type="button">= =</button>
      <button data-eye="wince" class="eye-btn" type="button">&gt; &lt;</button>
      <button data-eye="happy" class="eye-btn" type="button">^ ^</button>
      <button data-eye="sparkle" class="eye-btn" type="button">✦ ✦</button>
    </div>
  </aside>

  <!-- Modal: External Three.js Asset Factory Code -->
  <div id="code-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-panel rounded-3xl max-w-4xl w-full max-h-[86vh] flex flex-col overflow-hidden border border-amber-300/40">
      <div class="px-6 py-4 border-b border-amber-300/20 flex items-center justify-between">
        <div>
          <h2 class="serif-title text-lg font-bold text-amber-100">📦 World 04 · Three.js 外部资产模块 (<code class="text-amber-300">World04PaperAssets</code>)</h2>
          <p class="text-xs text-amber-200/70">可直接挂载或导入任何 Three.js 工程的模块化 3D 纸雕资产生成工厂 API</p>
        </div>
        <button id="btn-close-code-modal" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-amber-100 flex items-center justify-center">✕</button>
      </div>
      <div class="p-5 overflow-y-auto space-y-3 text-xs font-mono bg-black/50 flex-1">
        <pre id="code-snippet-box" class="p-4 rounded-xl bg-stone-950/90 text-amber-100 overflow-x-auto leading-relaxed border border-white/10 select-all"></pre>
      </div>
      <div class="px-6 py-3.5 border-t border-amber-300/20 flex items-center justify-end gap-2 bg-black/40">
        <button id="btn-copy-code" class="px-4 py-2 rounded-xl text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-stone-950 transition">📋 复制独立资产模块代码</button>
        <button id="btn-download-js" class="px-4 py-2 rounded-xl text-xs font-semibold gold-badge text-amber-100 hover:bg-amber-400/30 transition">⬇️ 下载 world_04_paper_assets.js</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl glass-panel border border-amber-300/60 text-xs font-medium text-amber-100 shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300">
    已执行操作
  </div>

  <script src="./01_math_and_physics.js"></script>
  <script src="./02_paper_textures.js"></script>
  <script src="./03_paper_assets_factory.js"></script>
  <script src="./04_sound_engine.js"></script>
  <script src="./05_scene_and_camera.js"></script>
  <script src="./06_story_choreography.js"></script>
  <script src="./07_ui_and_exporter.js"></script>
  <script src="./08_render_loop.js"></script>
</body>
</html>
