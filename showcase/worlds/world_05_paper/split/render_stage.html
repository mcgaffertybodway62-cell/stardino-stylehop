<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>World 05 · 纸雕立体书山谷 · 30.0s 完整成片渲染舞台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #140809;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }
    #overlay-2d {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 1920x1080 Full-Screen 3D Stage -->
  <div id="canvas-container"></div>
  <canvas id="overlay-2d" width="1920" height="1080"></canvas>

  <!-- Complete Set of Hidden DOM Placeholders to Prevent 06/07/08 Null Reference Errors -->
  <div id="hud-dom-placeholders" style="display:none;">
    <span id="hud-fps">60 FPS</span>
    <button id="btn-mode-stage"></button>
    <button id="btn-mode-studio"></button>
    <button id="btn-cam-toggle"></button>
    <span id="cam-badge"></span>
    <button id="btn-audio-toggle"></button>
    <span id="audio-icon"></span>
    <span id="audio-label"></span>
    <button id="btn-open-code-modal"></button>
    <span id="hud-desc"></span>
    <span id="subtitle-emoji"></span>
    <span id="time-current"></span>
    <button id="btn-play-pause"></button>
    <span id="play-icon"></span>
    <button id="btn-reset-view"></button>
    <button id="btn-snap-keyframe"></button>
    <button id="btn-snapshot-png"></button>
    <button id="btn-ignite-all"></button>
    <input id="slider-timeline" type="range" min="0" max="30" step="0.01" value="0" />
    <input id="slider-fold" type="range" min="0" max="1" step="0.01" value="1" />
    <input id="slider-explode" type="range" min="0" max="2" step="0.01" value="0" />
    <span id="val-explode">0.0</span>
    <select id="select-speed"><option value="1.0">1.0x</option></select>
    <input id="chk-creases" type="checkbox" checked />
    <input id="chk-wireframe" type="checkbox" />
    <input id="chk-turntable" type="checkbox" checked />
    <div id="left-panel"></div>
    <div id="code-modal"></div>
    <button id="btn-close-code-modal"></button>
    <pre id="code-snippet-box"></pre>
    <button id="btn-copy-code"></button>
    <button id="btn-download-js"></button>
    <button id="btn-export-obj"></button>
    <button id="btn-export-json"></button>
    <div id="subtitle-banner"></div>
    <div id="toast"></div>
    <!-- 6 Beat Chapter Pills -->
    <button class="beat-btn"></button>
    <button class="beat-btn"></button>
    <button class="beat-btn"></button>
    <button class="beat-btn"></button>
    <button class="beat-btn"></button>
    <button class="beat-btn"></button>
    <!-- Eye Buttons -->
    <button class="eye-btn" data-eye="pill"></button>
    <button class="eye-btn" data-eye="happy"></button>
    <button class="eye-btn" data-eye="wince"></button>
    <button class="eye-btn" data-eye="sparkle"></button>
  </div>

  <!-- Intercept Automatic RAF Loop for Deterministic Headless Step Rendering -->
  <script>
    window.__RENDER_STAGE_MODE__ = true;
    window.__origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      if (window.__RENDER_STAGE_MODE__) return 0;
      return window.__origRAF(cb);
    };
  </script>

  <!-- Load Split Scene Modules in Exact Original Order -->
  <script src="./01_math_and_physics.js"></script>
  <script src="./02_paper_textures.js"></script>
  <script src="./03_paper_assets_factory.js"></script>
  <script src="./04_sound_engine.js"></script>
  <script src="./05_scene_and_camera.js"></script>
  <script src="./06_story_choreography.js"></script>
  <script src="./07_ui_and_exporter.js"></script>
  <script src="./08_render_loop.js"></script>

  <!-- Deterministic Stage Controller & Transition Canvas -->
  <script>
    // Ensure 1920x1080 fixed render size with 1.0 pixel ratio
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(1.0);
    renderer.outputEncoding = THREE.LinearEncoding;
    camera.aspect = 1920 / 1080;
    camera.updateProjectionMatrix();

    // 2D Transition Canvas Renderer
    function renderOverlay(t) {
      const overlayCanvas = document.getElementById('overlay-2d');
      const ctx = overlayCanvas.getContext('2d');
      ctx.clearRect(0, 0, 1920, 1080);

      // 1. BEAT 1 OPENING COVER TRANSITION (0.0s - 0.72s)
      // Seamless 1-to-1 handover from World 04's Cinnabar & Gold-Foil Origami Medallion Cover, peeling immediately at t=0.0s!
      if (t < 0.72) {
        const peelU = Math.min(1.0, Math.max(0.0, t / 0.72));
        const easePeel = peelU * peelU * (3.0 - 2.0 * peelU);
        const alpha = Math.max(0.0, 1.0 - Math.pow(peelU, 1.35));

        ctx.save();
        ctx.globalAlpha = alpha;

        // Hardcover book cover peel perspective transformation starting immediately at t=0.0s
        const shiftX = -easePeel * 540;
        const scaleX = 1.0 - easePeel * 0.36;
        ctx.translate(shiftX, 0);
        ctx.scale(scaleX, 1.0);

        // Rich cinnabar book cloth gradient (#C92F22 -> #B8281C -> #75130D)
        const bgGrad = ctx.createRadialGradient(960, 540, 150, 960, 540, 1100);
        bgGrad.addColorStop(0.0, '#C92F22');
        bgGrad.addColorStop(0.65, '#B8281C');
        bgGrad.addColorStop(1.0, '#75130D');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1920, 1080);

        // Subtle book cloth texture lines
        ctx.fillStyle = 'rgba(255, 230, 180, 0.035)';
        for (let y = 0; y < 1080; y += 4) {
          ctx.fillRect(0, y, 1920, 1);
        }

        // Spine groove shadow on left
        const spineGrad = ctx.createLinearGradient(0, 0, 100, 0);
        spineGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.7)');
        spineGrad.addColorStop(0.6, 'rgba(0, 0, 0, 0.2)');
        spineGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = spineGrad;
        ctx.fillRect(0, 0, 100, 1080);

        // Double Gold-Foil Border
        ctx.strokeStyle = '#F3D279';
        ctx.lineWidth = 4;
        ctx.strokeRect(96, 64, 1920 - 192, 1080 - 128);

        ctx.strokeStyle = '#D9A948';
        ctx.lineWidth = 2;
        ctx.strokeRect(108, 76, 1920 - 216, 1080 - 152);

        // Classical Gold-Foil Cloud-Meander Corner Ornaments & Corner Medallions (matching World 04 Frame 1680!)
        const corners = [
          [96, 64, 1, 1], [1920 - 96, 64, -1, 1],
          [96, 1080 - 64, 1, -1], [1920 - 96, 1080 - 64, -1, -1]
        ];
        corners.forEach(([ccx, ccy, sxc, syc]) => {
          ctx.fillStyle = '#FFE599';
          ctx.beginPath();
          ctx.arc(ccx, ccy, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(243, 210, 121, 0.88)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(ccx + sxc * 24, ccy + syc * 58);
          ctx.lineTo(ccx + sxc * 24, ccy + syc * 24);
          ctx.lineTo(ccx + sxc * 58, ccy + syc * 24);
          ctx.moveTo(ccx + sxc * 34, ccy + syc * 44);
          ctx.lineTo(ccx + sxc * 34, ccy + syc * 34);
          ctx.lineTo(ccx + sxc * 44, ccy + syc * 34);
          ctx.stroke();
        });

        // Top Golden 16-Point Gemini Star Crest at (960, 390)
        ctx.save();
        ctx.translate(960, 390);
        const starGlow = ctx.createRadialGradient(0, 0, 8, 0, 0, 88);
        starGlow.addColorStop(0.0, 'rgba(255, 235, 153, 0.55)');
        starGlow.addColorStop(1.0, 'rgba(212, 160, 52, 0.0)');
        ctx.fillStyle = starGlow;
        ctx.beginPath();
        ctx.arc(0, 0, 88, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFEB99';
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const r = i % 2 === 0 ? 56 : 24;
          const angle = (i * Math.PI) / 8;
          const x = r * Math.sin(angle);
          const y = -r * Math.cos(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        // Twin 4-point star emblems flanking the 16-point star crest
        [-72, 72].forEach((sideX) => {
          ctx.fillStyle = '#FFF8E0';
          ctx.beginPath();
          for (let j = 0; j < 8; j++) {
            const r4 = j % 2 === 0 ? 14 : 4.2;
            const a4 = (j * Math.PI) / 4;
            const px = sideX + r4 * Math.sin(a4);
            const py = -r4 * Math.cos(a4);
            if (j === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
        });
        ctx.restore();

        // Centerpiece Gold-Foil Origami Valley Medallion at (960, 610) (matching World 04 Frame 1680!)
        ctx.save();
        ctx.translate(960, 610);
        ctx.strokeStyle = 'rgba(243, 210, 121, 0.88)';
        ctx.lineWidth = 3.0;
        ctx.beginPath();
        ctx.arc(0, 0, 138, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(217, 169, 72, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 128, 0, Math.PI * 2);
        ctx.stroke();

        // Gold-foil origami mountain ridges inside medallion
        const mRidges = [
          { pts: [[-115, 42], [-52, -18], [8, 28], [64, -26], [115, 42]], a: 0.32 },
          { pts: [[-98, 56], [-22, 4], [44, 42], [98, 56]], a: 0.48 }
        ];
        mRidges.forEach((m) => {
          ctx.beginPath();
          ctx.moveTo(m.pts[0][0], m.pts[0][1]);
          for (let k = 1; k < m.pts.length; k++) ctx.lineTo(m.pts[k][0], m.pts[k][1]);
          ctx.closePath();
          ctx.fillStyle = `rgba(242, 199, 92, ${m.a})`;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 235, 158, 0.85)';
          ctx.lineWidth = 2.0;
          ctx.stroke();
        });

        function drawGoldFoilCrane(cx, cy, sc, fa) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(sc, sc);
          const facets = [
            { pts: [[-18, -8], [-88, -62], [-32, -28]], col: `rgba(219, 166, 61, ${0.85 * fa})` },
            { pts: [[-28, 6], [0, -24], [28, 4], [0, 22]], col: `rgba(242, 199, 97, ${0.95 * fa})` },
            { pts: [[18, -2], [56, -48], [44, -52], [8, -10]], col: `rgba(250, 219, 122, ${0.96 * fa})` },
            { pts: [[56, -48], [74, -40], [48, -42]], col: `rgba(255, 240, 173, ${0.98 * fa})` },
            { pts: [[-22, 2], [-72, -36], [-54, -8]], col: `rgba(230, 179, 77, ${0.92 * fa})` },
            { pts: [[-14, -4], [42, -74], [16, 12]], col: `rgba(255, 232, 143, ${0.98 * fa})` }
          ];
          facets.forEach((f) => {
            ctx.beginPath();
            ctx.moveTo(f.pts[0][0], f.pts[0][1]);
            for (let i = 1; i < f.pts.length; i++) ctx.lineTo(f.pts[i][0], f.pts[i][1]);
            ctx.closePath();
            ctx.fillStyle = f.col;
            ctx.fill();
            ctx.strokeStyle = `rgba(255, 247, 209, ${0.92 * fa})`;
            ctx.lineWidth = 2.0;
            ctx.stroke();
          });
          ctx.restore();
        }

        drawGoldFoilCrane(-6, -4, 1.08, 1.0);
        drawGoldFoilCrane(-78, -42, 0.48, 0.85);
        drawGoldFoilCrane(76, -36, 0.45, 0.85);

        // Flanking horizontal gold-foil scroll rules with diamond terminals
        [-1, 1].forEach((dirS) => {
          const x0 = dirS * 168;
          const x1 = dirS * 420;
          ctx.strokeStyle = 'rgba(243, 210, 121, 0.82)';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(x0, 0);
          ctx.lineTo(x1, 0);
          ctx.stroke();
          [[x0, 7], [dirS * 290, 5], [x1, 7]].forEach(([dxd, rd]) => {
            ctx.fillStyle = 'rgba(255, 235, 153, 0.92)';
            ctx.beginPath();
            ctx.moveTo(dxd, -rd);
            ctx.lineTo(dxd + rd * 1.4, 0);
            ctx.lineTo(dxd, rd);
            ctx.lineTo(dxd - rd * 1.4, 0);
            ctx.closePath();
            ctx.fill();
          });
        });
        ctx.restore();

        ctx.restore();
      }

      // 2. BEAT 6 HANDOVER TO WORLD 06 GOTHIC STAINED GLASS (29.2s - 30.0s)
      if (t >= 29.2) {
        const prog = Math.min(1.0, (t - 29.2) / 0.8);
        const easeProg = prog * prog * (3 - 2 * prog);
        const alpha = easeProg;

        ctx.save();
        ctx.globalAlpha = alpha;

        // Dark cathedral background (#07070C)
        ctx.fillStyle = 'rgba(7, 7, 12, ' + (0.35 + 0.65 * easeProg) + ')';
        ctx.fillRect(0, 0, 1920, 1080);

        // Stained glass rosette pattern centered at screen
        const cx = 960, cy = 540;
        const maxR = 480 + easeProg * 180;
        const rotation = (1.0 - easeProg) * 0.8;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);

        // Gothic 8-fold Stained Glass Petals
        const petals = 8;
        const colors = ['#C81D25', '#0F4C81', '#F5A623', '#1B8A5A', '#8E2800', '#6A1B9A', '#D9381E', '#007791'];

        // Outer glass segments
        for (let i = 0; i < petals; i++) {
          const a0 = (i * 2 * Math.PI) / petals;
          const a1 = ((i + 1) * 2 * Math.PI) / petals;

          ctx.beginPath();
          ctx.moveTo(Math.cos(a0) * 160, Math.sin(a0) * 160);
          ctx.lineTo(Math.cos(a0) * maxR, Math.sin(a0) * maxR);
          ctx.arc(0, 0, maxR, a0, a1);
          ctx.lineTo(Math.cos(a1) * 160, Math.sin(a1) * 160);
          ctx.arc(0, 0, 160, a1, a0, true);
          ctx.closePath();

          ctx.fillStyle = colors[i % colors.length];
          ctx.fill();

          // Glass internal lighting highlight
          const midA = (a0 + a1) / 2;
          const hx = Math.cos(midA) * (maxR * 0.55);
          const hy = Math.sin(midA) * (maxR * 0.55);
          const glassGlow = ctx.createRadialGradient(hx, hy, 10, hx, hy, 180);
          glassGlow.addColorStop(0.0, 'rgba(255, 255, 255, 0.45)');
          glassGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0.35)');
          ctx.fillStyle = glassGlow;
          ctx.fill();

          // Heavy black lead came strips (#0B0B10)
          ctx.strokeStyle = '#0B0B10';
          ctx.lineWidth = 18;
          ctx.stroke();
        }

        // Inner rosette circle
        for (let i = 0; i < petals; i++) {
          const a0 = (i * 2 * Math.PI) / petals;
          const a1 = ((i + 1) * 2 * Math.PI) / petals;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 160, a0, a1);
          ctx.closePath();
          ctx.fillStyle = colors[(i + 4) % colors.length];
          ctx.fill();

          ctx.strokeStyle = '#0B0B10';
          ctx.lineWidth = 14;
          ctx.stroke();
        }

        // Center jewel medallion
        ctx.beginPath();
        ctx.arc(0, 0, 55, 0, Math.PI * 2);
        ctx.fillStyle = '#FFE57F';
        ctx.fill();
        ctx.strokeStyle = '#0B0B10';
        ctx.lineWidth = 16;
        ctx.stroke();

        // Outer thick gothic stone/lead ring
        ctx.beginPath();
        ctx.arc(0, 0, maxR, 0, Math.PI * 2);
        ctx.strokeStyle = '#0B0B10';
        ctx.lineWidth = 26;
        ctx.stroke();

        ctx.restore();

        // Dark outer vignette
        const darkVignette = ctx.createRadialGradient(960, 540, 420, 960, 540, 1000);
        darkVignette.addColorStop(0.0, 'rgba(0, 0, 0, 0.0)');
        darkVignette.addColorStop(1.0, 'rgba(5, 5, 10, ' + (0.5 + 0.5 * easeProg) + ')');
        ctx.fillStyle = darkVignette;
        ctx.fillRect(0, 0, 1920, 1080);

        ctx.restore();
      }
    }

    // Deterministic stepFrame(t) for Offline Playwright Rendering
    window.stepFrame = function(t) {
      // 1. Evaluate complete 30.0s choreography
      evaluateStoryChoreography(t);

      // 2. Camera positioning
      if (camState.targetPos && camState.targetLookAt) {
        camera.position.copy(camState.targetPos);
        camera.lookAt(camState.targetLookAt);
      } else if (t >= 28.8) {
        // In Beat 6 ending (28.8s - 30.0s), camera zooms towards the rotating Zoetrope Pavilion!
        const diveU = clamp((t - 28.8) / 1.2, 0.0, 1.0);
        const easeU = diveU * diveU * (3 - 2 * diveU);

        const curTarget = new THREE.Vector3().lerpVectors(
          new THREE.Vector3(0.0, 5.15, -0.35),
          new THREE.Vector3(-8.8, 3.85, 0.65),
          easeU
        );
        const curRadius = lerp(26.2, 8.5, easeU);
        const curPhi = lerp(1.46, 1.42, easeU);
        const curTheta = lerp(0.0, 0.22, easeU);

        camera.position.x = curTarget.x + curRadius * Math.sin(curPhi) * Math.sin(curTheta);
        camera.position.y = curTarget.y + curRadius * Math.cos(curPhi);
        camera.position.z = curTarget.z + curRadius * Math.sin(curPhi) * Math.cos(curTheta);
        camera.lookAt(curTarget);
      } else {
        // Standard Panorama framing
        const r = camState.desiredSpherical.radius;
        const phi = camState.desiredSpherical.phi;
        const theta = camState.desiredSpherical.theta;
        const target = camState.desiredTarget;

        camera.position.x = target.x + r * Math.sin(phi) * Math.sin(theta);
        camera.position.y = target.y + r * Math.cos(phi);
        camera.position.z = target.z + r * Math.sin(phi) * Math.cos(theta);
        camera.lookAt(target);
      }

      // 3. Render Three.js 3D scene
      renderer.render(scene, camera);

      // 4. Render 2D seamless transition overlay
      renderOverlay(t);
    };

    // Ready signal for Playwright
    window.__STAGE_READY__ = true;
    console.log("[RenderStage] World 05 Paper Theater stage initialized and ready!");
  </script>
</body>
</html>
