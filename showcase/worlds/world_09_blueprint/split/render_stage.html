<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>World 09 · 建筑蓝图升维剧场 · 34.0s Story Render Stage</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #091e3e;
    }
    #viewportContainer {
      position: fixed;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 9999;
      overflow: hidden;
      background: #0b2246;
    }
    #compositeCanvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Fullscreen 1920x1080 Master Stage Container (No overlays, clean rendering) -->
  <div id="viewportContainer">
    <!-- Offscreen 2D Backdrop Canvas -->
    <canvas id="bgCanvas" width="1920" height="1080" style="display:none;"></canvas>
    <!-- Offscreen Three.js WebGL Canvas -->
    <canvas id="threeCanvas" width="1920" height="1080" style="display:none;"></canvas>
    <!-- Visible Master Composite Canvas -->
    <canvas id="compositeCanvas" width="1920" height="1080"></canvas>
  </div>

  <!-- Hidden UI placeholders so 08_ui_controls_export_and_main.js initializes seamlessly without errors -->
  <div style="display: none !important;">
    <input type="range" id="timelineSlider" min="0" max="34" step="0.02" value="0.00" />
    <span id="timeReadout">0.00</span>
    <span id="hudTimeBadge"></span>
    <span id="hudModeBadge"></span>
    <span id="beatTitleBadge"></span>
    <input type="range" id="sliderExtrude" min="0" max="1.25" step="0.01" value="1.00" />
    <span id="valExtrude"></span>
    <input type="range" id="sliderSplit" min="0" max="100" step="1" value="53" />
    <span id="valSplit"></span>
    <input type="range" id="sliderSquash" min="0.55" max="1.40" step="0.01" value="0.88" />
    <span id="valSquash"></span>
    <span id="valSx"></span>
    <div id="toastBox"></div>
    <button id="btnPlayPause"><span id="playIcon">▶</span></button>
    <button id="btnSpeedToggle"></button>
    <button id="btnTriggerJump"></button>
    <button id="btnSpringPop"></button>
    <button id="btnResetCamera"></button>
    <button id="btnToggleAudio"><span id="audioIcon">🔊</span><span id="audioLabel">音效 ON</span></button>
    <button id="btnExportPng"></button>
    <button id="btnExportTransparentAsset"></button>
    <button id="btnExportJsonSpec"></button>
    <input type="checkbox" id="chkTransparentBg" />
    <input type="checkbox" id="chkWireframeOverlay" checked />
    <input type="checkbox" id="chkShowBlueprintHUD" checked />
    <input type="checkbox" id="chkAutoRotate" />
    <div id="activeAssetTag"></div>
    <div id="storyModal" class="hidden">
      <pre id="storyMarkdownContent"></pre>
      <button id="btnStoryDoc"></button>
      <button id="btnCloseStoryModal"></button>
      <button id="btnCloseStoryModalBottom"></button>
      <button id="btnCopyStory"></button>
    </div>
    <div id="apiModal" class="hidden">
      <pre id="apiCodeSnippet"></pre>
      <button id="btnApiHelp"></button>
      <button id="btnCloseModal"></button>
      <button id="btnCloseModalBottom"></button>
      <button id="btnCopyApi"></button>
    </div>
    <button class="mode-tab" data-mode="story"></button>
    <button class="mode-tab" data-mode="split"></button>
    <button class="mode-tab" data-mode="sandbox"></button>
    <button class="mode-tab" data-mode="inspector"></button>
    <button class="asset-btn" data-asset="all"></button>
    <button class="eye-btn" data-eye="pill"></button>
    <button class="beat-btn" data-seek="1.0"></button>
  </div>

  <!-- Intercept RAF & Map compositeCanvas <-> fgCanvas -->
  <script>
    window.__RENDER_STAGE_MODE__ = true;
    window.__origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      if (window.__RENDER_STAGE_MODE__) return 0;
      return window.__origRAF(cb);
    };

    const _origGet = document.getElementById.bind(document);
    document.getElementById = function(id) {
      if (id === 'fgCanvas') return _origGet('compositeCanvas') || _origGet('fgCanvas');
      if (id === 'compositeCanvas') return _origGet('compositeCanvas') || _origGet('fgCanvas');
      return _origGet(id);
    };

    const _origQS = document.querySelector.bind(document);
    document.querySelector = function(sel) {
      if (sel === '#fgCanvas') return _origGet('compositeCanvas');
      return _origQS(sel);
    };
  </script>

  <!-- Load Split Modules 01 to 08 -->
  <script src="01_core_math_and_audio.js"></script>
  <script src="02_state_and_cyanotype_paper.js"></script>
  <script src="03_three_scene_and_3d_assets.js"></script>
  <script src="04_scene_hierarchy_and_ripples.js"></script>
  <script src="05_blueprint_2d_slime.js"></script>
  <script src="06_composite_blueprint_renderer.js"></script>
  <script src="07_choreography_34s_timeline.js"></script>
  <script src="08_ui_controls_export_and_main.js"></script>

  <!-- Deterministic Stage Controller -->
  <script>
    // Ensure strict 1920x1080 canvas sizing
    const compCanvas = document.getElementById('compositeCanvas');
    compCanvas.width = 1920;
    compCanvas.height = 1080;
    renderer.setSize(1920, 1080, false);
    renderer.setPixelRatio(1);

    state.viewMode = 'story';
    state.playing = false;
    state.activeAsset = 'all';
    state.showBlueprintHUD = true;

    window.stepFrame = function(t) {
      state.playing = false;
      state.t = clamp(Number(t) || 0.0, 0.0, TOTAL_DURATION);
      state.viewMode = 'story';
      state.activeAsset = 'all';
      updateSceneForTimeAndState(state.t);
      if (typeof syncUIReadouts === 'function') syncUIReadouts();
      return true;
    };

    // Initialize frame 0
    window.stepFrame(0.0);
    window.__STAGE_READY__ = true;
    console.log("[RenderStage] World 09 1920x1080 deterministic blueprint stage initialized!");
  </script>
</body>
</html>
