<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>World 08 · 定格软陶手作书桌 · 15.0s Story Render Stage</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1e1820;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    canvas#three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
    canvas#transition-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 10;
      pointer-events: none;
    }
    /* Retain tilt-shift overlay and warm sunlight vignette */
    .tilt-shift-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22%;
      pointer-events: none;
      backdrop-filter: blur(10px) saturate(1.08);
      -webkit-backdrop-filter: blur(10px) saturate(1.08);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0) 100%);
      z-index: 5;
    }
    .tilt-shift-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22%;
      pointer-events: none;
      backdrop-filter: blur(11px) saturate(1.08);
      -webkit-backdrop-filter: blur(11px) saturate(1.08);
      mask-image: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0) 100%);
      z-index: 5;
    }
    .sunlight-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 35% 30%, rgba(255, 244, 224, 0.12) 0%, rgba(13, 9, 18, 0.45) 80%, rgba(10, 6, 14, 0.72) 100%);
      mix-blend-mode: multiply;
      z-index: 6;
    }
  </style>
</head>
<body class="text-amber-50">
  <div id="canvas-container">
    <!-- Main 3D WebGL Canvas -->
    <canvas id="three-canvas" width="1920" height="1080"></canvas>

    <!-- Tilt-Shift Blur Bands -->
    <div id="tilt-top" class="tilt-shift-top"></div>
    <div id="tilt-bottom" class="tilt-shift-bottom"></div>
    <div class="sunlight-vignette"></div>

    <!-- 2D Overlay Canvas for Trumpet Iris-In (0-0.8s) & Kaleidoscope Blueprint Transition (13.8-15.0s) -->
    <canvas id="transition-canvas" width="1920" height="1080"></canvas>

    <!-- Hidden DOM Elements for UI logic compatibility -->
    <div style="display: none !important;">
      <header>
        <span id="screen-indicator">屏 1 · 文具区 (小喇叭)</span>
        <button id="mode-story-btn"></button>
        <button id="mode-sandbox-btn"></button>
        <button id="mode-keyframe-btn"></button>
        <button id="open-assets-btn"></button>
        <button id="cam-view-btn"></button>
        <button id="toggle-dof-btn"></button>
        <button id="toggle-audio-btn"></button>
      </header>

      <span id="beat-time-badge">0.0s / 15.0s</span>
      <span id="hud-eye-mode">dizzy</span>
      <span id="hud-squash">1.0</span>
      <p id="beat-narrative-text"></p>
      <p id="beat-sfx-text"></p>

      <div id="sandbox-controls-card">
        <button id="sandbox-reset-btn"></button>
        <button id="act-left-btn"></button>
        <button id="act-right-btn"></button>
        <button id="act-jump-btn"></button>
        <button id="act-eye-btn"></button>
        <button id="act-domino-btn"></button>
      </div>

      <input id="timeline-slider" type="range" min="0" max="15.0" step="0.01" value="0" />
      <button id="play-pause-btn"></button>
      <button id="restart-btn"></button>
      <button id="speed-btn"></button>
      <button id="snap-png-btn"></button>

      <div id="assets-modal">
        <button id="close-assets-btn"></button>
        <div id="asset-cards-container"></div>
        <span id="asset-export-status"></span>
        <button id="export-all-json-btn"></button>
      </div>
    </div>
  </div>

  <!-- Intercept RAF for deterministic stepFrame control -->
  <script>
    window.__RENDER_STAGE_MODE__ = true;
    window.__origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      if (window.__RENDER_STAGE_MODE__) return 0;
      return window.__origRAF(cb);
    };
  </script>

  <!-- Load Split Modules 01 to 12 -->
  <script src="01_constants_and_materials.js"></script>
  <script src="02_web_audio_synth.js"></script>
  <script src="03_scene_and_desk_env.js"></script>
  <script src="04_hero_slime_and_guide_star.js"></script>
  <script src="05_props_trumpet_mug_domino_macaron.js"></script>
  <script src="06_props_stationery_succulent_kaleidoscope.js"></script>
  <script src="07_surface_heightfield_and_flight_engine.js"></script>
  <script src="08_storyboard_timeline_director.js"></script>
  <script src="09_sandbox_physics_engine.js"></script>
  <script src="10_transition_overlays_2d.js"></script>
  <script src="11_ui_controls_and_inspector.js"></script>
  <script src="12_main_loop.js"></script>

  <!-- Deterministic Stage Controller -->
  <script>
    // Force 1920x1080 canvas sizing
    function setupRenderResolution() {
      const w = 1920;
      const h = 1080;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      transCanvas.width = w;
      transCanvas.height = h;
    }
    setupRenderResolution();

    appMode = 'story';
    isPlaying = false;
    camPreset = 'side'; // Cinematic tracking preset (follows targetCam trajectory)

    // Reset dynamics state for frame 0
    slimeDynamics.prevX = -22.4;
    slimeDynamics.prevTime = -1.0;
    slimeDynamics.rollAngle = 0.0;
    slimeDynamics.squashY = 1.0;

    window.applyTimelineAt = function(t, dt) {
      return evaluateStoryAtTime(t, dt || 1/30);
    };

    window.renderTransitionOverlay = function(t) {
      if (typeof renderTransitionsOverlay === 'function') {
        renderTransitionsOverlay(t);
      }
    };

    window.stepFrame = function(t) {
      const dt = 1.0 / 30.0;
      currentTime = t;
      appMode = 'story';
      isPlaying = false;

      // Rotate kaleidoscope wheel
      if (typeof kaleidoscopeWheel !== 'undefined' && kaleidoscopeWheel) {
        kaleidoscopeWheel.rotation.x = t * 1.4;
      }

      // Update 6-act narrative & physics
      evaluateStoryAtTime(t, dt);

      // Update stardust particles
      updateStarDust(dt);

      // Render 3D WebGL Scene
      renderer.render(scene, camera);

      // Render 2D Transition Overlay
      renderTransitionsOverlay(t);
    };

    // Mark stage ready
    window.__STAGE_READY__ = true;
    console.log("[RenderStage] Initialized 1920x1080 deterministic stage!");
  </script>
</body>
</html>
