<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Cyber Graffiti Cut-In — HTML-in-Canvas × WebGL2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #050924;
    font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif;
  }
  canvas#stage {
    width: 1920px;
    height: 1080px;
    display: block;
  }
  #dom-scene {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #060b28;
    user-select: none;
  }

  /* Iconic Vertical Cyan Neon Sign: 下一站 · 未来 */
  #neon-sign-future {
    position: absolute;
    left: 230px;
    top: 170px;
    width: 54px;
    height: 262px;
    background: #030714;
    border: 2.5px solid #00e5ff;
    box-shadow: 0 0 22px rgba(0, 229, 255, 0.55), inset 0 0 12px rgba(0, 229, 255, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: #00e5ff;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 8px;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.9);
    z-index: 12;
  }

  /* Street-Art Stencil Badge: 03 // OVERDRIVE */
  #overdrive-stencil-badge {
    position: absolute;
    left: 1125px;
    top: 238px;
    background: #e6ff1f;
    color: #090b14;
    border: 3.5px solid #090b14;
    padding: 6px 18px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    transform: rotate(-8deg) skewX(-12deg);
    box-shadow: 6px 6px 0 #8a3cff, 0 0 24px rgba(230, 255, 31, 0.55);
    z-index: 16;
  }

  /* Diagonal Maglev Turbine Core / Tachometer HUD Cut-in Panel */
  #turbine-cutin-panel {
    position: absolute;
    right: 42px;
    top: 28px;
    width: 760px;
    height: 152px;
    background: linear-gradient(95deg, #050819 0%, #0b1130 62%, #180d3a 100%);
    border-top: 3px solid #00f0ff;
    border-bottom: 3px solid #e6ff1f;
    border-left: 6px solid #ff2a85;
    border-right: 3px solid #00f0ff;
    transform: skewX(-14deg);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.78), 0 0 26px rgba(0, 240, 255, 0.35);
    overflow: hidden;
    z-index: 20;
  }
  #turbine-cutin-panel .halftone {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(155, 114, 203, 0.28) 1.5px, transparent 1.5px);
    background-size: 8px 8px;
    pointer-events: none;
  }
  #turbine-cutin-panel .hud-top {
    position: absolute;
    left: 18px;
    top: 8px;
    font-size: 11.5px;
    font-weight: 800;
    color: #e6ff1f;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(230, 255, 31, 0.7);
  }
  #turbine-cutin-panel .hud-bottom {
    position: absolute;
    right: 22px;
    bottom: 8px;
    font-size: 12.5px;
    font-weight: 800;
    color: #00f0ff;
    letter-spacing: 1.8px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.85);
  }
  #turbine-cutin-panel .hud-tag {
    position: absolute;
    left: 18px;
    bottom: 8px;
    font-size: 11px;
    color: #ff5c9e;
    font-weight: 800;
    letter-spacing: 1.4px;
  }

  /* Bottom-Right Cyber Telemetry Pill */
  #cyber-telemetry {
    position: absolute;
    right: 52px;
    bottom: 36px;
    display: flex;
    gap: 14px;
    z-index: 18;
  }
  .tele-card {
    background: rgba(6, 12, 38, 0.88);
    border: 1.5px solid rgba(0, 229, 255, 0.65);
    border-left: 4px solid #e6ff1f;
    padding: 7px 14px;
    color: #e6f7ff;
    transform: skewX(-10deg);
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.22);
  }
  .tele-card .k {
    font-size: 10px;
    color: #79b8ff;
    letter-spacing: 1px;
  }
  .tele-card .v {
    font-size: 15px;
    font-weight: 800;
    color: #e6ff1f;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" content="drawable" layoutsubtree>
  <div id="dom-scene" drawable>
    <!-- 1. Vertical Cyan Neon Box Sign -->
    <div id="neon-sign-future">下一站·未来</div>

    <!-- 2. Kinetic Street-Art Stencil Badge -->
    <div id="overdrive-stencil-badge">03 // OVERDRIVE</div>

    <!-- 3. Diagonal Maglev Turbine Core / Tachometer HUD Cut-in Panel -->
    <div id="turbine-cutin-panel">
      <div class="halftone"></div>
      <div class="hud-top">MAGLEV_03 // FRAME RUPTURE: 100% &nbsp;|&nbsp; CATENARY ARC: 27.5kV</div>
      <svg width="760" height="152" viewBox="0 0 760 152" style="position:absolute;inset:0;">
        <!-- Razor-Sharp Anime Speed Lines inside Cut-in Panel -->
        <g stroke="#00f0ff" stroke-width="1.4" opacity="0.55">
          <line x1="0" y1="36" x2="210" y2="36"/>
          <line x1="20" y1="54" x2="170" y2="54"/>
          <line x1="0" y1="98" x2="195" y2="98"/>
          <line x1="540" y1="32" x2="760" y2="32"/>
          <line x1="570" y1="74" x2="760" y2="74"/>
          <line x1="520" y1="114" x2="760" y2="114"/>
        </g>
        <g stroke="#e6ff1f" stroke-width="2" opacity="0.78">
          <polygon points="48,72 195,68 195,76" fill="#e6ff1f"/>
          <polygon points="545,52 720,48 720,56" fill="#e6ff1f"/>
          <polygon points="560,94 740,90 740,98" fill="#00f0ff" stroke="#00f0ff"/>
        </g>

        <!-- Left & Right Vector Tachometer Bar Gauges -->
        <g transform="translate(86, 40)">
          <text x="0" y="0" fill="#79b8ff" font-size="10" font-weight="700">FLUX_COIL_A</text>
          <rect x="0" y="8" width="110" height="8" fill="#101a42" stroke="#00f0ff" stroke-width="1"/>
          <rect x="0" y="8" width="96" height="8" fill="#00f0ff"/>
          <text x="0" y="34" fill="#79b8ff" font-size="10" font-weight="700">TORQUE_VECTOR</text>
          <rect x="0" y="42" width="110" height="8" fill="#101a42" stroke="#e6ff1f" stroke-width="1"/>
          <rect x="0" y="42" width="102" height="8" fill="#e6ff1f"/>
        </g>

        <!-- Center Rotating Maglev Turbine Core & Tachometer Ring (cx=365, cy=76) -->
        <g transform="translate(365, 76)">
          <circle cx="0" cy="0" r="56" fill="#050b24" stroke="#00f0ff" stroke-width="2" stroke-dasharray="14 6"/>
          <circle cx="0" cy="0" r="46" fill="none" stroke="#e6ff1f" stroke-width="2.5" stroke-dasharray="48 16"/>
          <g id="turbine-rotor-blades" stroke="#00f0ff" stroke-width="2" fill="rgba(0, 240, 255, 0.25)">
            <polygon points="0,-6 38,-18 28,4"/>
            <polygon points="6,0 18,38 -4,28"/>
            <polygon points="0,6 -38,18 -28,-4"/>
            <polygon points="-6,0 -18,-38 4,-28"/>
            <polygon points="4,-4 26,26 4,14" fill="rgba(230, 255, 31, 0.35)" stroke="#e6ff1f"/>
            <polygon points="-4,4 -26,-26 -4,-14" fill="rgba(230, 255, 31, 0.35)" stroke="#e6ff1f"/>
          </g>
          <circle cx="0" cy="0" r="12" fill="#e6ff1f" stroke="#0b0b14" stroke-width="2.5"/>
          <circle cx="0" cy="0" r="5" fill="#ffffff"/>
        </g>

        <!-- Right Digital Tachometer Readout inside Cut-in -->
        <g transform="translate(448, 56)">
          <text x="0" y="0" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="1.5">14,860 RPM</text>
          <text x="0" y="22" fill="#e6ff1f" font-size="13" font-weight="800" letter-spacing="1.2">BOOST // +240%</text>
          <text x="0" y="42" fill="#00f0ff" font-size="11" font-weight="700">MAG-LEVITATION LOCKED</text>
        </g>
      </svg>
      <div class="hud-tag">TOKEN: 破框锐片 [SHARD_03]</div>
      <div class="hud-bottom">TURBINE CORE // MACH 1.4 LOCK-ON</div>
    </div>

    <!-- 4. Bottom-Right Cyber Telemetry -->
    <div id="cyber-telemetry">
      <div class="tele-card">
        <div class="k">WORLD_ID</div>
        <div class="v">03 · CYBER GRAFFITI</div>
      </div>
      <div class="tele-card">
        <div class="k">TURBINE CORE</div>
        <div class="v" id="vel-readout">MACH 1.42 LOCK-ON</div>
      </div>
      <div class="tele-card">
        <div class="k">DRIVE_STATE</div>
        <div class="v">03 // OVERDRIVE</div>
      </div>
    </div>

    <!-- 5. Main Full-Screen SVG Stage: Cyber Skyscrapers + 3D Rail Tracks + Maglev Train + Jagged Graffiti Frame + Catenary Arcs & Shards -->
    <svg id="cyber-svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0;z-index:5;">
      <defs>
        <linearGradient id="arasakaSign" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3c0e4f"/>
          <stop offset="50%" stop-color="#6e165c"/>
          <stop offset="100%" stop-color="#220936"/>
        </linearGradient>
        <pattern id="halftoneBurst" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="5" cy="5" r="2.2" fill="#8a3cff" opacity="0.55"/>
        </pattern>
      </defs>

      <!-- ==================== LAYER 0: LAYERED DEEP CYBER NIGHT SKY & NEON SKYSCRAPERS ==================== -->
      <polygon points="0,0 1920,0 1920,165 0,218" fill="#0d1956"/>
      <polygon points="0,218 1920,165 1920,368 0,435" fill="#08113c"/>
      <polygon points="0,435 1920,368 1920,1080 0,1080" fill="#050a26"/>

      <!-- Distant Cyber Skyscraper Silhouettes & ARASAKA / 荒坂塔 Neon Tower -->
      <g id="cyber-skyline" opacity="0.58">
        <g transform="translate(48, 88)">
          <rect x="0" y="0" width="150" height="460" fill="#060c28" stroke="#00e5ff" stroke-width="1.2" opacity="0.7"/>
          <line x1="38" y1="0" x2="38" y2="460" stroke="#00e5ff" stroke-width="0.7" opacity="0.4"/>
          <line x1="76" y1="0" x2="76" y2="460" stroke="#00e5ff" stroke-width="0.7" opacity="0.4"/>
          <line x1="114" y1="0" x2="114" y2="460" stroke="#00e5ff" stroke-width="0.7" opacity="0.4"/>
        </g>

        <g transform="translate(760, 28)">
          <rect x="0" y="0" width="230" height="460" fill="#070d2b" stroke="#233975" stroke-width="2"/>
          <rect x="24" y="22" width="182" height="126" fill="url(#arasakaSign)" stroke="#ff2a85" stroke-width="1.8"/>
          <circle cx="115" cy="46" r="7" fill="none" stroke="#ff5c9e" stroke-width="2"/>
          <circle cx="107" cy="58" r="7" fill="none" stroke="#ff5c9e" stroke-width="2"/>
          <circle cx="123" cy="58" r="7" fill="none" stroke="#ff5c9e" stroke-width="2"/>
          <text x="115" y="82" fill="#ffd6ec" font-size="13" font-weight="800" letter-spacing="4" text-anchor="middle">ARASAKA</text>
          <text x="115" y="106" fill="#ff4d94" font-size="18" font-weight="800" letter-spacing="6" text-anchor="middle">荒坂塔</text>
          <text x="115" y="130" fill="#ff9ec4" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">重工防御</text>
          <g stroke="#d8f4ff" stroke-width="2.5" opacity="0.75">
            <line x1="24" y1="168" x2="206" y2="238"/>
            <line x1="206" y1="168" x2="24" y2="238"/>
            <line x1="24" y1="238" x2="206" y2="308"/>
            <line x1="206" y1="238" x2="24" y2="308"/>
            <line x1="24" y1="168" x2="206" y2="168"/>
            <line x1="24" y1="238" x2="206" y2="238"/>
            <line x1="24" y1="308" x2="206" y2="308"/>
          </g>
        </g>

        <g transform="translate(1690, 180)">
          <rect x="0" y="0" width="190" height="720" fill="#060c2a" stroke="#00d8ff" stroke-width="1.5"/>
          <rect x="-12" y="60" width="12" height="320" fill="#ff2a85"/>
          <g stroke="#00e5ff" stroke-width="0.9" opacity="0.45">
            <line x1="0" y1="80" x2="190" y2="110"/>
            <line x1="0" y1="160" x2="190" y2="190"/>
            <line x1="0" y1="240" x2="190" y2="270"/>
            <line x1="0" y1="320" x2="190" y2="350"/>
            <line x1="48" y1="0" x2="48" y2="720"/>
            <line x1="96" y1="0" x2="96" y2="720"/>
            <line x1="144" y1="0" x2="144" y2="720"/>
          </g>
        </g>
      </g>

      <!-- ==================== LAYER 0.5: 3D PERSPECTIVE MAGLEV RAIL TRACKS & HALFTONE STREET-ART BURST ==================== -->
      <g id="maglev-rail-viaduct">
        <!-- Halftone Street-Art Spray Circle behind Frame Rupture -->
        <circle cx="1220" cy="490" r="260" fill="url(#halftoneBurst)" />
        <!-- 3D Perspective Maglev Guideway Viaduct Beams extending toward Bottom-Right -->
        <polygon points="720,840 1920,930 1920,1045 640,910" fill="#0a0e29" stroke="#0b0b14" stroke-width="4"/>
        <!-- Glowing Cyan & Fluorescent-Yellow Maglev Guideway Rails -->
        <line x1="720" y1="852" x2="1920" y2="942" stroke="#00e5ff" stroke-width="6"/>
        <line x1="690" y1="884" x2="1920" y2="988" stroke="#8a3cff" stroke-width="5"/>
        <line x1="660" y1="904" x2="1920" y2="1024" stroke="#e6ff1f" stroke-width="4"/>
        <!-- Perspective Track Sleepers -->
        <g stroke="#00e5ff" stroke-width="3" opacity="0.75">
          <line x1="920" y1="866" x2="880" y2="918"/>
          <line x1="1080" y1="878" x2="1040" y2="932"/>
          <line x1="1250" y1="892" x2="1210" y2="948"/>
          <line x1="1430" y1="905" x2="1390" y2="965"/>
          <line x1="1620" y1="920" x2="1580" y2="982"/>
          <line x1="1810" y1="934" x2="1770" y2="998"/>
        </g>
      </g>

      <!-- ==================== LAYER 1: CYBER MAGLEV TRAIN (2D CEL INSIDE FRAME -> 3D LOW-POLY OUTSIDE) ==================== -->
      <g id="maglev-train-group">
        <!-- Rear Car (Left Edge x: -20..465, Flat 2D Street-Art Cel) -->
        <g id="train-rear-car" stroke="#0b0b14" stroke-width="4" stroke-linejoin="round">
          <polygon points="-20,860 155,838 152,922 -20,938" fill="#080810"/>
          <polygon points="-20,820 260,782 256,826 -20,864" fill="#7c3bff"/>
          <polygon points="-20,768 312,730 308,796 -20,828" fill="#0c0c14"/>
          <polygon points="-20,432 346,396 312,730 -20,768" fill="#f3f2ed"/>
          <polygon points="-20,584 332,548 322,616 -20,654" fill="#e6ff1f"/>
          <polygon points="126,422 284,404 268,554 116,570" fill="#0099dc"/>
          <polygon points="-20,390 390,344 346,396 -20,432" fill="#9c72f8"/>
          <polygon points="346,396 390,344 496,360 440,422" fill="#f3f2ed"/>
          <polygon points="346,428 402,420 374,736 316,742" fill="#8547ff"/>
          <polygon points="326,644 382,638 376,708 320,714" fill="#e6ff1f"/>
          <polygon points="374,412 468,402 440,736 368,742" fill="#0a0a12"/>
          <polygon points="248,676 716,772 714,846 244,894" fill="#7b38ff"/>
          <polygon points="244,854 714,804 714,852 244,900" fill="#080810"/>
        </g>

        <!-- Lead Car Left Section (Inside Graffiti Frame x: 430..1185) -->
        <g id="train-mid-car" stroke="#0b0b14" stroke-width="4" stroke-linejoin="round">
          <polygon points="464,392 732,306 686,360 440,404" fill="#9c72f8"/>
          <polygon points="732,306 1054,298 1226,356 814,382 686,360" fill="#f3f2ed"/>
          <polygon points="686,360 814,382 842,442 664,458" fill="#0b1546"/>
          <polygon points="814,382 1038,354 1034,414 842,442" fill="#9c72f8"/>
          <polygon points="440,404 686,360 644,702 434,716" fill="#f3f2ed"/>
          <polygon points="516,390 634,368 618,518 504,532" fill="#0099dc"/>
          <polygon points="436,538 664,512 656,578 434,604" fill="#e6ff1f"/>
          <polygon points="434,702 652,686 648,766 432,772" fill="#0a0a12"/>
          <polygon points="664,512 1182,366 1188,468 656,578" fill="#e6ff1f"/>
          <polygon points="656,578 1188,468 1178,714 646,698" fill="#f3f2ed"/>
          <polygon points="646,698 1178,714 1170,836 642,762" fill="#0a0a12"/>
        </g>

        <!-- High-Voltage Roof Pantograph & Cyan Aerodynamic Slipstream Fin on Train Roof -->
        <g id="train-roof-pantograph" stroke="#0b0b14" stroke-width="3.5" stroke-linejoin="round">
          <polygon points="1028,266 1358,348 1538,412 1218,354" fill="#00e5ff"/>
          <!-- Mechanical Pantograph Arm & High-Voltage Collector Head at (1285, 310) -->
          <polygon points="1220,342 1275,288 1345,296 1310,356" fill="#8a3cff"/>
          <polyline points="1235,340 1282,272 1355,274" fill="none" stroke="#e6ff1f" stroke-width="5"/>
          <rect x="1262" y="264" width="68" height="12" rx="4" fill="#00e5ff" stroke="#0b0b14" stroke-width="3"/>
        </g>

        <!-- Lead Car 3D Faceted Nose Bursting OUTSIDE the Graffiti Frame (x: 1180..1688) -->
        <g id="train-nose-3d" stroke="#0b0b14" stroke-width="4.5" stroke-linejoin="round">
          <polygon points="1182,366 1218,354 1210,830 1170,836" fill="#3a2875"/>
          <polygon points="1216,352 1622,430 1682,530 1218,454" fill="#e6ff1f"/>
          <polygon points="1218,454 1682,530 1672,782 1210,730" fill="#3b2878"/>
          <polygon points="1206,730 1674,780 1668,900 1192,882" fill="#080912"/>
          <polygon id="nose-diamond-emblem" points="1356,544 1428,604 1348,682 1276,602" fill="#e6ff1f" stroke="#0b0b14" stroke-width="3.5"/>
          <!-- Headlight Laser Beams on 3D Nose -->
          <polygon points="1645,565 1920,520 1920,610 1642,615" fill="rgba(0, 229, 255, 0.28)" stroke="none"/>
        </g>
      </g>

      <!-- ==================== LAYER 2: JAGGED PURPLE & FLUORESCENT-YELLOW STREET GRAFFITI FRAME ==================== -->
      <g id="graffiti-frame-group">
        <!-- Street-Art Yellow Crown at Top-Left Corner (265, 52) -->
        <polygon id="graffiti-crown" points="252,82 242,48 258,56 270,34 284,52 302,34 309,68" fill="#e6ff1f" stroke="#0b0b14" stroke-width="3.5" stroke-linejoin="round"/>

        <!-- Outer Purple Jagged Graffiti Frame Body (#8A3CFF) with Thick Black Street Outline -->
        <path d="
          M 202,78
          L 408,92 L 592,98 L 656,114 L 826,114 L 876,130 L 992,130 L 1102,142
          L 1098,214 L 1084,296 L 1080,414 L 1024,492 L 992,470
          L 1038,396 L 1036,298 L 1060,214 L 1060,168
          L 864,168 L 814,152 L 656,154 L 584,132 L 386,128 L 236,112
          L 216,320 L 198,512 L 192,642 L 172,796 L 172,844
          L 318,856 L 444,858 L 520,868 L 656,876 L 746,850
          L 758,882 L 668,914 L 516,906 L 434,892 L 306,892 L 130,876
          L 132,792 L 154,638 L 160,508 L 178,312 Z"
          fill="#8a3cff" stroke="#0b0b14" stroke-width="4" stroke-linejoin="round"/>

        <!-- Inner Fluorescent-Yellow Jagged Graffiti Stripe (#E6FF1F) -->
        <path d="
          M 216,88
          L 404,102 L 588,108 L 654,124 L 822,124 L 872,140 L 1082,150
          L 1080,214 L 1064,296 L 1062,404 L 1016,472 L 1004,464
          L 1046,398 L 1046,296 L 1068,214 L 1068,160
          L 868,156 L 818,140 L 652,142 L 584,122 L 392,118 L 226,102
          L 206,316 L 188,510 L 182,640 L 162,794 L 160,854
          L 312,866 L 440,868 L 518,878 L 658,888 L 740,862
          L 746,874 L 662,902 L 516,892 L 436,880 L 308,880 L 142,866
          L 144,792 L 166,638 L 172,508 L 190,314 Z"
          fill="#e6ff1f"/>

        <!-- 3 Dripping Purple & Yellow Paint Tags along Bottom Frame Edge -->
        <g>
          <path d="M 304,870 L 316,870 L 306,964 C 304,972 298,970 300,962 Z" fill="#8a3cff" stroke="#0b0b14" stroke-width="2.5"/>
          <circle cx="310" cy="964" r="5" fill="#e6ff1f" stroke="#0b0b14" stroke-width="2"/>
        </g>
        <g>
          <path d="M 442,878 L 456,878 L 444,932 C 442,938 436,936 438,928 Z" fill="#8a3cff" stroke="#0b0b14" stroke-width="2.5"/>
          <circle cx="448" cy="932" r="5.5" fill="#e6ff1f" stroke="#0b0b14" stroke-width="2"/>
        </g>
        <g>
          <path d="M 564,888 L 576,888 L 564,988 C 562,994 556,992 558,984 Z" fill="#8a3cff" stroke="#0b0b14" stroke-width="2.5"/>
          <circle cx="569" cy="986" r="5" fill="#e6ff1f" stroke="#0b0b14" stroke-width="2"/>
        </g>
      </g>

      <!-- ==================== LAYER 3: SHATTERED GRAFFITI FRAME SHARDS (破框锐片) & SPEED WEDGES ==================== -->
      <g id="shattered-shards-group" stroke="#0b0b14" stroke-width="3" stroke-linejoin="round">
        <polygon id="speed-wedge-1" points="1384,186 1776,188 1776,206" fill="#00e5ff"/>
        <polygon id="speed-wedge-2" points="1536,238 1812,242 1812,262" fill="#00e5ff"/>
        <polygon id="speed-wedge-3" points="1306,278 1510,272 1510,294" fill="#e6ff1f"/>
        <polygon id="speed-wedge-4" points="928,606 1284,614 1284,628" fill="#e6ff1f"/>

          <polygon points="1070,590 1116,568 1094,610 1076,608" fill="#ffffff"/>

      <!-- ==================== LAYER 4: HIGH-VOLTAGE CATENARY ARC SPARKS & STREET-ART STARBURST (1320, 260) ==================== -->
      <g id="catenary-sparks-group">
        <!-- Overhead Catenary Power Cable -->
        <line x1="980" y1="224" x2="1880" y2="292" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="16 6" opacity="0.85"/>
        <!-- Crackling Electric Arc Lightning Bolts from Pantograph (1295, 265) -->
        <g id="electric-arc-bolts" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1295,268 1335,232 1322,252 1388,214 1372,238 1445,204" stroke="#00e5ff" stroke-width="4.5"/>

        <g id="cyber-guiding-star" transform="translate(1540, 236)">

<script type="module">
import {
  createDomShaderStage,
  springStep,
  smootherstep,
  lerp,
  clamp,
} from '../dom_shader.js';

window.DUR = 4.0;

const canvas = document.getElementById('stage');
const domScene = document.getElementById('dom-scene');

const FRAG_SOURCE = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_dom;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_impactPos;
uniform float u_shockwave;

float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

void main() {
  vec2 px = v_uv * u_res;
  vec2 uv = v_uv;

  // 1. Upper-Right Turbine Core Cut-In Panel Scanline & Micro-Glitch
  bool inCutin = (px.x > 1090.0 && px.y < 190.0);
  if (inCutin) {
    float lineHash = hash11(floor(px.y * 0.35) + floor(u_time * 18.0));
    if (lineHash > 0.94) {
      uv.x += (lineHash - 0.94) * 0.035;
    }
  }

  // 2. Radial Chromatic Aberration & Speed-Line Shockwave from Frame-Rupture Point
  vec2 delta = px - u_impactPos;
  float dist = length(delta);
  vec2 dir = dist > 0.001 ? delta / dist : vec2(1.0, 0.0);

  float ringRadius = mod(u_time * 520.0, 950.0);
  float ringWave = exp(-pow((dist - ringRadius) / 48.0, 2.0)) * u_shockwave;

  float caShift = (0.0012 + 0.0028 * ringWave) * smoothstep(120.0, 820.0, dist);
  vec2 uvR = clamp(uv + dir * caShift, 0.0, 1.0);
  vec2 uvB = clamp(uv - dir * caShift, 0.0, 1.0);

  float r = texture(u_dom, uvR).r;
  vec4 baseG = texture(u_dom, uv);
  float b = texture(u_dom, uvB).b;
  vec3 col = vec3(r, baseG.g, b);

  // 3. Unreal-Style 9-Tap Neon Bloom on High-Luminance Cyan / Fluorescent-Yellow / Magenta Pixels
  vec3 bloomSum = vec3(0.0);
  vec2 texel = 3.5 / u_res;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      vec3 s = texture(u_dom, clamp(uv + vec2(float(x), float(y)) * texel, 0.0, 1.0)).rgb;
      float lum = max(s.r, max(s.g, s.b));
      float sat = lum - min(s.r, min(s.g, s.b));
      if (lum > 0.72 && sat > 0.35) {
        bloomSum += s;
      }
    }
  }
  col += (bloomSum / 9.0) * 0.16;

  // 4. Radial Anime Speed-Line Shimmer around Impact Zone
  float angle = atan(delta.y, delta.x);
  float speedRay = pow(max(0.0, sin(angle * 42.0 + u_time * 8.0)), 10.0);
  float rayMask = smoothstep(260.0, 780.0, dist) * (1.0 - smoothstep(780.0, 1150.0, dist));
  col += vec3(0.15, 0.92, 1.0) * speedRay * rayMask * 0.12;

  if (inCutin) {
    float scan = 0.94 + 0.06 * sin(px.y * 2.4 + u_time * 24.0);
    col *= scan;
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

const stage = createDomShaderStage(canvas, domScene, FRAG_SOURCE, [
  'u_impactPos',
  'u_shockwave',
]);

const maglevTrainGroup = document.getElementById('maglev-train-group');
const explodingPolygons = document.getElementById('exploding-polygons');
const electricArcBolts = document.getElementById('electric-arc-bolts');
const cyberGuidingStar = document.getElementById('cyber-guiding-star');
const turbineCutinPanel = document.getElementById('turbine-cutin-panel');
const turbineRotorBlades = document.getElementById('turbine-rotor-blades');
const graffitiCrown = document.getElementById('graffiti-crown');
const velReadout = document.getElementById('vel-readout');

const speedWedges = [];
for (let i = 1; i <= 9; i++) {
  speedWedges.push(document.getElementById(`speed-wedge-${i}`));
}

window.render = async function (t) {
  const sec = clamp(t, 0, window.DUR);

  // 1. Maglev Train Lunge & High-Speed Track Vibration
  const lungeSpring = springStep(sec, 0.28, 6.5);
  const trainDx = lerp(-24, 22, clamp(lungeSpring.x, 0, 1.25)) + 2.5 * Math.sin(sec * 22.0);
  const trainDy = lerp(8, -6, clamp(lungeSpring.x, 0, 1.25)) + 1.8 * Math.cos(sec * 27.0);
  maglevTrainGroup.setAttribute(
    'transform',
    `translate(${trainDx.toFixed(2)}, ${trainDy.toFixed(2)})`
  );

  // 2. Shattered Graffiti Frame Shards (破框锐片) exploding outward from frame break
  const burstProgress = smootherstep(0.0, 3.8, sec);
  const shardScale = 1.0 + 0.1 * burstProgress;
  const shardDx = 42 * burstProgress + 4 * Math.sin(sec * 6.0);
  const shardDy = 16 * burstProgress;
  explodingPolygons.setAttribute(
    'transform',
    `translate(${shardDx.toFixed(2)}, ${shardDy.toFixed(2)}) translate(1180, 650) scale(${shardScale.toFixed(3)}) translate(-1180, -650)`
  );

  // Speed wedges streaky oscillation
  for (let i = 0; i < speedWedges.length; i++) {
    const wDx = 32 * Math.sin(sec * 7.5 + i * 1.3);
    speedWedges[i].setAttribute('transform', `translate(${wDx.toFixed(1)}, 0)`);
  }

  // Street-art crown bounce
  const crownBounce = -4 * Math.abs(Math.sin(sec * 4.5));
  graffitiCrown.setAttribute('transform', `translate(0, ${crownBounce.toFixed(2)})`);

  // 3. High-Voltage Catenary Arc Sparks & Starburst
  const arcScale = 0.92 + 0.18 * Math.sin(sec * 16.0);
  electricArcBolts.setAttribute(
    'transform',
    `translate(${trainDx.toFixed(2)}, ${trainDy.toFixed(2)}) translate(1295, 268) scale(${arcScale.toFixed(3)}) translate(-1295, -268)`
  );

  const starX = 1540 + 18 * Math.sin(sec * 3.0);
  const starY = 236 - 12 * Math.cos(sec * 3.8);
  const starRot = 15 * Math.sin(sec * 4.2);
  const starScale = 1.0 + 0.16 * Math.sin(sec * 6.5);
  cyberGuidingStar.setAttribute(
    'transform',
    `translate(${starX.toFixed(2)}, ${starY.toFixed(2)}) rotate(${starRot.toFixed(2)}) scale(${starScale.toFixed(3)})`
  );

  // 4. Maglev Turbine Core / Tachometer HUD Cut-in Panel slash & rotor spin
  const cutinSpring = springStep(sec + 0.25, 0.26, 10.0);
  const cutinSlideX = (1.0 - clamp(cutinSpring.x, 0, 1.15)) * 180;
  turbineCutinPanel.style.transform = `skewX(-14deg) translateX(${cutinSlideX.toFixed(1)}px)`;

  const rotorAngle = sec * 240;
  turbineRotorBlades.setAttribute('transform', `rotate(${rotorAngle.toFixed(1)})`);

  // Telemetry Mach readout
  const mach = (1.38 + 0.08 * smootherstep(0.0, 3.5, sec) + 0.01 * Math.sin(sec * 12.0)).toFixed(2);
  velReadout.textContent = `MACH ${mach} LOCK-ON`;

  // 5. Sync DOM Paint -> Upload to WebGL2 -> Draw Fullscreen Shader
  await stage.syncAndUpload();

  const { gl, uniforms } = stage;
  gl.uniform2f(uniforms.u_res, canvas.width, canvas.height);
  gl.uniform1f(uniforms.u_time, sec);
  gl.uniform2f(uniforms.u_impactPos, 1185.0 + trainDx, 520.0 + trainDy);
  gl.uniform1f(uniforms.u_shockwave, 0.85);
  stage.drawQuad();
};

await window.render(0.0);
window.READY = true;
</script>
