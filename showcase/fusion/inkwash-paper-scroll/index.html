<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Inkwash Paper Scroll — HTML-in-Canvas × WebGL2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #180b07;
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  }
  canvas#stage {
    width: 1920px;
    height: 1080px;
    display: block;
  }
  #dom-scene {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 960px 540px, #2b1610 0%, #170b07 70%, #0e0604 100%);
    user-select: none;
  }

  /* Classical Vertical Chinese Colophon Calligraphy on Left Xuan-Paper Spread */
  #ink-colophon {
    position: absolute;
    left: 192px;
    top: 126px;
    height: 360px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: #23201c;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 5px;
    line-height: 1.9;
    z-index: 15;
    pointer-events: none;
  }
  #ink-colophon .col-dot {
    color: #c83228;
    font-weight: 900;
  }
  #ink-mini-seal {
    position: absolute;
    left: 192px;
    top: 472px;
    width: 24px;
    height: 38px;
    background: #c62f24;
    border-radius: 4px;
    color: #fff6ec;
    font-size: 11px;
    line-height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
    box-shadow: 0 0 8px rgba(198, 47, 36, 0.45);
    z-index: 15;
  }

  /* Radiant Vermilion Cinnabar Seal Stamp Token (朱砂墨印: 双子奇观) */
  #cinnabar-seal-box {
    position: absolute;
    left: 618px;
    top: 122px;
    width: 96px;
    height: 96px;
    background: #be291e;
    border: 2.5px solid #8f1810;
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(210, 50, 35, 0.48), inset 0 0 10px rgba(255, 220, 200, 0.25);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    padding: 6px;
    z-index: 14;
  }
  #cinnabar-seal-box span {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fcf5ec;
    font-size: 28px;
    font-weight: 700;
    border: 0.5px solid rgba(252, 245, 236, 0.32);
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" layoutsubtree>
  <div id="dom-scene">
    <!-- Left Spread Classical Colophon Calligraphy (Pure Song Landscape Poetry) -->
    <div id="ink-colophon">
      卷四<span class="col-dot">・</span>千里水墨<span class="col-dot">・</span>悬毫画桥化墨荷<br/>
      奇石孤亭<span class="col-dot">・</span>朱砂锦鲤<span class="col-dot">・</span>层峦叠翠入画来
    </div>
    <div id="ink-mini-seal">山水</div>

    <!-- Cinnabar Seal Token (朱砂墨印: 双子奇观) -->
    <div id="cinnabar-seal-box">
      <span>奇</span><span>双</span>
      <span>观</span><span>子</span>
    </div>

    <!-- Full-Screen Open Pop-Up Scroll Book SVG Stage -->
    <svg id="scroll-book-svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0;z-index:5;">
      <defs>
        <!-- Clip paths for Left Xuan-Paper Spread & Right Pop-Up Cardstock Spread inside the Open Book -->
        <clipPath id="bookBackdropClip">
          <polygon points="106,56 1814,56 1826,736 94,736"/>
        </clipPath>
        <clipPath id="leftSpreadClip">
          <polygon points="106,56 960,56 960,736 94,736"/>
        </clipPath>
        <clipPath id="rightSpreadClip">
          <polygon points="960,56 1814,56 1826,736 960,736"/>
        </clipPath>

        <!-- 35-Degree Warm Directional Cardstock Drop-Shadow Filter -->
        <filter id="cardstockShadow35" x="-15%" y="-15%" width="135%" height="135%">
          <feDropShadow dx="7" dy="5" stdDeviation="4" flood-color="#1e0b16" flood-opacity="0.45"/>
        </filter>

        <!-- Gradients for Left Song-Dynasty Xuan Paper & Ink Mountains -->
        <linearGradient id="xuanPaperGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f2ede2"/>
          <stop offset="65%" stop-color="#e8e0d0"/>
          <stop offset="100%" stop-color="#ddd3c0"/>
        </linearGradient>
        <linearGradient id="inkMountainFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#94918a" stop-opacity="0.48"/>
          <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="inkMountainMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6e6c66" stop-opacity="0.58"/>
          <stop offset="85%" stop-color="#cfc8b8" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0.0"/>
        </linearGradient>
        <linearGradient id="scholarRockGrad" x1="0" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#35383b"/>
          <stop offset="55%" stop-color="#5a5e61"/>
          <stop offset="100%" stop-color="#9c9990"/>
        </linearGradient>
        <linearGradient id="inkLotusLeaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2c3e4c"/>
          <stop offset="55%" stop-color="#475b68"/>
          <stop offset="100%" stop-color="#8b969c"/>
        </linearGradient>
        <linearGradient id="lotusPetalGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d85a62"/>
          <stop offset="55%" stop-color="#f2b8b4"/>
          <stop offset="100%" stop-color="#fff9f5"/>
        </linearGradient>

        <!-- Gradients for Right Pop-Up Cardstock Valley & Concentric Golden Sun -->
        <linearGradient id="nightCardstockGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3f1e66"/>
          <stop offset="60%" stop-color="#56287a"/>
          <stop offset="100%" stop-color="#72347f"/>
        </linearGradient>
        <radialGradient id="sunLayer1" cx="0.5" cy="0.5" r="0.5">
          <stop offset="60%" stop-color="#ebb057"/>
          <stop offset="100%" stop-color="#df9b42"/>
        </radialGradient>
        <radialGradient id="sunLayer2" cx="0.5" cy="0.5" r="0.5">
          <stop offset="60%" stop-color="#f3c16d"/>
          <stop offset="100%" stop-color="#e6ad54"/>
        </radialGradient>
        <radialGradient id="sunLayer3" cx="0.5" cy="0.5" r="0.5">
          <stop offset="55%" stop-color="#fad689"/>
          <stop offset="100%" stop-color="#efc06b"/>
        </radialGradient>
        <radialGradient id="sunLayer4" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#fff8d6"/>
          <stop offset="100%" stop-color="#fae19c"/>
        </radialGradient>
        <radialGradient id="lanternHalo" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#ffae42" stop-opacity="0.78"/>
          <stop offset="45%" stop-color="#ff7b29" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ridgeAmber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#eb9f52"/>
          <stop offset="100%" stop-color="#c67438"/>
        </linearGradient>
        <linearGradient id="ridgeTerracotta" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cf6253"/>
          <stop offset="100%" stop-color="#9e3d3c"/>
        </linearGradient>
        <linearGradient id="ridgeCrimson" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9a375a"/>
          <stop offset="100%" stop-color="#6d2046"/>
        </linearGradient>
        <linearGradient id="ridgeAubergine" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#642456"/>
          <stop offset="100%" stop-color="#42143d"/>
        </linearGradient>
        <linearGradient id="ridgeDarkPlum" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#411742"/>
          <stop offset="100%" stop-color="#260b29"/>
        </linearGradient>

        <!-- Reusable Hanging Red-Gold Paper Lantern Symbol -->
        <g id="paper-lantern">
          <circle cx="0" cy="0" r="64" fill="url(#lanternHalo)"/>
          <ellipse cx="0" cy="0" rx="22" ry="29" fill="#e83828" stroke="#ffd269" stroke-width="1.8"/>
          <ellipse cx="0" cy="0" rx="14" ry="29" fill="none" stroke="#ffb84d" stroke-width="1.2"/>
          <ellipse cx="0" cy="0" rx="6" ry="29" fill="none" stroke="#ffd97d" stroke-width="1.1"/>
          <rect x="-9" y="-32" width="18" height="4" rx="1.5" fill="#ffd269"/>
          <rect x="-8" y="28" width="16" height="4" rx="1.5" fill="#ffd269"/>
          <line x1="0" y1="32" x2="0" y2="50" stroke="#ff4738" stroke-width="2.5"/>
          <circle cx="0" cy="36" r="2.5" fill="#ffd269"/>
        </g>
      </defs>

      <!-- ==================== 1. ANTIQUE POP-UP BOOK HARDCOVER & STANDING BACKDROP FRAME ==================== -->
      <polygon points="32,740 1888,740 1906,1054 14,1054" fill="rgba(0,0,0,0.68)"/>
      <polygon points="88,36 1832,36 1846,736 74,736" fill="#6b1d24" stroke="#d8a852" stroke-width="3"/>
      <polygon points="100,46 1820,46 1832,736 88,736" fill="#f5ede0"/>

      <!-- ==================== 2. CLIPPED VERTICAL BACKDROP (LEFT INKWASH SCROLL + RIGHT POP-UP VALLEY) ==================== -->
      <g clip-path="url(#bookBackdropClip)">
        <!-- LEFT HALF (x: 94..960): WORLD 04 SONG-DYNASTY XUAN PAPER INKWASH SCROLL -->
        <g clip-path="url(#leftSpreadClip)">
          <rect x="80" y="40" width="885" height="710" fill="url(#xuanPaperGrad)"/>

          <!-- Concentric Vermilion Seal Ripple Rings around Cinnabar Seal (cx=666, cy=170) -->
          <g id="seal-ripple-rings" transform="translate(666, 170)" fill="none" stroke="#cf3a2b">
            <circle cx="0" cy="0" r="76" stroke-width="4" opacity="0.32"/>
            <circle cx="0" cy="0" r="112" stroke-width="3.5" opacity="0.22"/>
            <circle cx="0" cy="0" r="152" stroke-width="3" opacity="0.14"/>
            <circle cx="0" cy="0" r="196" stroke-width="2.5" opacity="0.08"/>
          </g>

          <!-- Distant Song-Dynasty Misty Ink-Wash Mountains -->
          <path d="M 80,380 Q 190,280 310,330 T 560,250 T 820,210 L 965,260 L 965,560 L 80,560 Z" fill="url(#inkMountainFar)"/>
          <path d="M 80,440 Q 220,350 360,390 Q 510,240 640,320 Q 780,230 960,310 L 960,640 L 80,640 Z" fill="url(#inkMountainMid)"/>

          <!-- Left-Edge Ink Bamboo Stalks & Leaves -->
          <g stroke="#5e5c57" stroke-width="5" stroke-linecap="round">
            <line x1="138" y1="310" x2="144" y2="730" opacity="0.45"/>
            <line x1="164" y1="240" x2="172" y2="730" opacity="0.65"/>
          </g>
          <path d="M 96,52 L 296,174" stroke="#1e1d1b" stroke-width="6" stroke-linecap="round"/>
          <g fill="#22211e">
            <polygon points="154,86 146,124 158,94"/>
            <polygon points="158,88 168,122 164,92"/>
            <polygon points="204,118 198,158 210,126"/>
            <polygon points="208,120 222,154 214,124"/>
            <polygon points="254,148 248,188 260,156"/>
            <polygon points="258,150 274,182 264,154"/>
          </g>

          <!-- ==================== LOWER-LEFT FOREGROUND: INKWASH SCHOLAR ROCK & INK PINE PAVILION (水墨奇石与孤亭水波) ==================== -->
          <g id="ink-scholar-rock-pavilion" transform="translate(278, 560)">
            <!-- Concentric Ink Water Ripples around Scholar Rock Base -->
            <g id="scholar-rock-ripples" fill="none" stroke="rgba(45, 50, 54, 0.42)">
              <ellipse cx="10" cy="82" rx="115" ry="22" stroke-width="1.6"/>
              <ellipse cx="10" cy="82" rx="82" ry="15" stroke-width="1.3"/>
              <ellipse cx="10" cy="82" rx="48" ry="9" stroke-width="1.1"/>
            </g>

            <!-- Song-Dynasty Ink Pine Tree (水墨古松) growing from the cliffside -->
            <g stroke="#22201d" fill="none" stroke-linecap="round">
              <path d="M -22,-24 C -48,-46 -78,-42 -102,-28" stroke-width="4.5"/>
              <path d="M -56,-38 L -82,-54" stroke-width="3"/>
              <!-- Pine Needle Clusters (松针) -->
              <g fill="rgba(35, 42, 40, 0.78)" stroke="none">
                <ellipse cx="-82" cy="-56" rx="22" ry="9"/>
                <ellipse cx="-104" cy="-30" rx="26" ry="10"/>
                <ellipse cx="-58" cy="-46" rx="18" ry="8"/>
              </g>
            </g>

            <!-- Classical Ink Pine Pavilion (水墨孤亭) perched atop the Scholar Rock -->
            <g transform="translate(8, -52)">
              <!-- Pavilion Stone Platform -->
              <rect x="-32" y="18" width="64" height="7" fill="#484a4c" stroke="#1e1d1b" stroke-width="1.5"/>
              <!-- Pavilion Timber Columns -->
              <line x1="-22" y1="-12" x2="-22" y2="18" stroke="#23201c" stroke-width="2.5"/>
              <line x1="-8" y1="-12" x2="-8" y2="18" stroke="#3b3834" stroke-width="2"/>
              <line x1="8" y1="-12" x2="8" y2="18" stroke="#3b3834" stroke-width="2"/>
              <line x1="22" y1="-12" x2="22" y2="18" stroke="#23201c" stroke-width="2.5"/>
              <!-- Sweeping Song-Dynasty Upturned Ink Eaves (飞檐) -->
              <path d="M -48,-8 Q -22,-14 0,-32 Q 22,-14 48,-8 Q 22,-10 -48,-8 Z" fill="#232220" stroke="#151412" stroke-width="1.8"/>
              <path d="M -34,-20 Q -14,-24 0,-38 Q 14,-24 34,-20 Z" fill="#3a3835" stroke="#151412" stroke-width="1.5"/>
            </g>

            <!-- Taihu Scholar Rock Promontory (水墨太湖奇石) with Cunfa Texture Strokes & Apertures -->
            <path d="M -76,80 C -88,42 -62,-6 -34,-28 C -12,-42 28,-38 46,-18 C 68,8 82,46 68,82 Z"
                  fill="url(#scholarRockGrad)" stroke="#1e1d1b" stroke-width="2.5"/>
            <!-- Hollow Taihu Rock Aperture & Cunfa Brush Contours -->
            <ellipse cx="-14" cy="24" rx="16" ry="11" fill="#e5ddcd" stroke="#2b2926" stroke-width="1.8"/>
            <path d="M -52,48 Q -28,18 12,38 T 48,58" fill="none" stroke="#23201c" stroke-width="2"/>
            <path d="M -38,12 Q -8,-12 28,8" fill="none" stroke="#23201c" stroke-width="1.8"/>
          </g>

          <!-- Unfinished Blank-Space Stone Arch Bridge (留白断桥) + Dynamic Ink Stroke -->
          <g id="ink-arch-bridge" transform="translate(65, -22)">
            <path d="M 245,575 Q 435,470 635,548 L 625,568 Q 435,495 255,592 Z" fill="#8b8882" fill-opacity="0.55" stroke="#2b2926" stroke-width="2.2"/>
            <path d="M 315,575 A 125,68 0 0,1 545,552" fill="none" stroke="#22201d" stroke-width="3"/>
            <path d="M 255,556 Q 435,452 630,530" fill="none" stroke="#2b2926" stroke-width="1.8"/>
            <line x1="300" y1="538" x2="300" y2="554" stroke="#2b2926" stroke-width="2"/>
            <line x1="365" y1="514" x2="365" y2="530" stroke="#2b2926" stroke-width="2"/>
            <line x1="435" y1="502" x2="435" y2="518" stroke="#2b2926" stroke-width="2"/>
            <line x1="505" y1="504" x2="505" y2="520" stroke="#2b2926" stroke-width="2"/>
            <line x1="570" y1="516" x2="570" y2="532" stroke="#2b2926" stroke-width="2"/>

            <path id="painted-bridge-stroke"
                  d="M 420,515 C 535,455 665,458 795,385"
                  fill="none" stroke="#3c444c" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
            <path id="painted-bridge-cinnabar"
                  d="M 420,515 C 535,455 665,458 795,385"
                  fill="none" stroke="#c83228" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
          </g>

          <!-- Splashed Cinnabar Red & Mineral Cyan Ink Dots along Bridge -->
          <g id="ink-splash-dots" transform="translate(55, -24)">
            <circle cx="495" cy="524" r="6" fill="#c83228" opacity="0.85"/>
            <circle cx="518" cy="542" r="4.5" fill="#2e6b9e" opacity="0.8"/>
            <circle cx="546" cy="512" r="7" fill="#c83228" opacity="0.75"/>
            <circle cx="582" cy="535" r="5" fill="#23201c" opacity="0.85"/>
            <circle cx="615" cy="498" r="5.5" fill="#2e6b9e" opacity="0.8"/>
            <circle cx="648" cy="518" r="6.5" fill="#c83228" opacity="0.82"/>
          </g>

          <!-- Suspended Celestial Ink Brush (天道毛笔) Painting the Bridge -->
          <g id="celestial-ink-brush" transform="translate(655, 365) rotate(18)">
            <rect x="-5" y="-220" width="10" height="175" rx="3" fill="#8c6239" stroke="#3b2614" stroke-width="1.5"/>
            <rect x="-6" y="-52" width="12" height="14" fill="#2b2623"/>
            <path d="M -6,-38 Q -11,-12 0,16 Q 11,-12 6,-38 Z" fill="#1d2630"/>
            <path d="M -4,-16 Q -6,-2 0,16 Q 6,-2 4,-16 Z" fill="#2e6b9e"/>
            <circle cx="0" cy="14" r="3" fill="#c83228"/>
          </g>

          <!-- Pond Water Ripples, Two Cinnabar Koi Fish (朱砂锦鲤) & White-Outline Ink Lotus -->
          <g id="pond-lotus-koi" transform="translate(72, -36)">
            <ellipse cx="445" cy="638" rx="95" ry="20" fill="none" stroke="rgba(90, 95, 100, 0.32)" stroke-width="1.3"/>
            <ellipse cx="445" cy="638" rx="62" ry="12" fill="none" stroke="rgba(90, 95, 100, 0.42)" stroke-width="1.2"/>
            <ellipse cx="645" cy="656" rx="110" ry="22" fill="none" stroke="rgba(90, 95, 100, 0.3)" stroke-width="1.3"/>

            <!-- Two Cinnabar Koi Fish (朱砂锦鲤) Swimming Gracefully -->
            <g id="cinnabar-koi-pair">
              <g id="koi-1" transform="translate(525, 588) rotate(-18)">
                <path d="M -48,12 Q -72,4 -88,18 Q -66,18 -54,18 Q -68,32 -82,42 Q -56,28 -44,20 Z" fill="#e65c3a"/>
                <path d="M -48,16 C -22,-6 18,-8 44,6 C 22,24 -18,28 -48,16 Z" fill="#d43824" stroke="#8f1d10" stroke-width="1.2"/>
                <path d="M -20,8 C 0,2 22,2 38,6" fill="none" stroke="#f7b379" stroke-width="1.6"/>
                <circle cx="32" cy="5" r="2.5" fill="#1a1817" stroke="#ffd269" stroke-width="1.2"/>
              </g>
              <g id="koi-2" transform="translate(418, 628) rotate(12)">
                <path d="M 36,8 Q 56,0 70,12 Q 52,12 42,14 Q 54,24 64,32 Q 44,20 34,14 Z" fill="#f07846"/>
                <path d="M 36,12 C 16,-4 -14,-6 -34,4 C -16,18 14,22 36,12 Z" fill="#e0522d" stroke="#9e2a18" stroke-width="1.1"/>
                <circle cx="-24" cy="4" r="2" fill="#1a1817" stroke="#ffd269" stroke-width="1"/>
              </g>
            </g>

            <!-- Ink Lotus Pads with Golden Veins -->
            <g transform="translate(365, 650)">
              <path d="M -58,0 C -54,-22 48,-24 62,-2 C 68,14 26,22 -12,24 C -38,16 -62,14 -58,0 Z"
                    fill="url(#inkLotusLeaf)" stroke="#23282c" stroke-width="1.6"/>
              <g stroke="#c8a858" stroke-width="1" opacity="0.75">
                <line x1="0" y1="4" x2="-46" y2="-6"/><line x1="0" y1="4" x2="-24" y2="-14"/>
                <line x1="0" y1="4" x2="12" y2="-16"/><line x1="0" y1="4" x2="46" y2="-6"/>
                <line x1="0" y1="4" x2="36" y2="12"/><line x1="0" y1="4" x2="-28" y2="14"/>
              </g>
            </g>

            <g transform="translate(595, 668)">
              <path d="M -98,-4 C -88,-38 82,-36 106,-2 C 118,22 52,32 -18,36 C -64,28 -104,18 -98,-4 Z"
                    fill="url(#inkLotusLeaf)" stroke="#23282c" stroke-width="1.8"/>
              <g stroke="#c8a858" stroke-width="1.2" opacity="0.8">
                <line x1="-6" y1="4" x2="-82" y2="-12"/><line x1="-6" y1="4" x2="-48" y2="-24"/>
                <line x1="-6" y1="4" x2="0" y2="-26"/><line x1="-6" y1="4" x2="52" y2="-22"/>
                <line x1="-6" y1="4" x2="84" y2="-4"/><line x1="-6" y1="4" x2="58" y2="18"/>
                <line x1="-6" y1="4" x2="-48" y2="22"/>
              </g>
            </g>

            <!-- Blooming Song-Dynasty White-Outline & Blush Lotus Flower -->
            <g id="ink-lotus-flower" transform="translate(658, 558)">
              <path d="M 0,22 Q -4,75 8,132" fill="none" stroke="#232629" stroke-width="3.5"/>
              <path d="M 0,18 C -26,-12 -24,-52 0,-72 C 24,-52 26,-12 0,18 Z" fill="url(#lotusPetalGrad)" stroke="#23201c" stroke-width="1.6"/>
              <path d="M 0,18 C -42,-4 -48,-38 -24,-62 C -8,-42 -6,-10 0,18 Z" fill="url(#lotusPetalGrad)" stroke="#23201c" stroke-width="1.5"/>
              <path d="M 0,18 C 42,-4 48,-38 24,-62 C 8,-42 6,-10 0,18 Z" fill="url(#lotusPetalGrad)" stroke="#23201c" stroke-width="1.5"/>
              <path d="M 0,20 C -48,10 -56,-22 -38,-44 C -16,-28 -12,0 0,20 Z" fill="url(#lotusPetalGrad)" stroke="#23201c" stroke-width="1.5"/>
              <path d="M 0,20 C 48,10 56,-22 38,-44 C 16,-28 12,0 0,20 Z" fill="url(#lotusPetalGrad)" stroke="#23201c" stroke-width="1.5"/>
              <path d="M 0,22 C -22,4 -18,-28 0,-46 C 18,-28 22,4 0,22 Z" fill="#fff6f2" stroke="#23201c" stroke-width="1.5"/>
              <ellipse cx="0" cy="18" rx="12" ry="8" fill="#eab949" stroke="#8c6218" stroke-width="1.2"/>
            </g>

import {

  springStep,
  smootherstep,
  lerp,

} from '../dom_shader.js';

window.DUR = 4.0;

const canvas = document.getElementById('stage');
const domScene = document.getElementById('dom-scene');

const FRAG_SOURCE = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_dom;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_sunPos;
uniform vec2 u_starPos;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float valueNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
  vec2 px = v_uv * u_res;
  vec2 uv = v_uv;

  // 1. Left Pond Water-Ripple & Ink Diffusion Micro-Displacement (x < 960, y in pond zone)
  if (px.x > 100.0 && px.x < 955.0 && px.y > 480.0 && px.y < 730.0) {
    float wave = sin(px.y * 0.14 - u_time * 4.2 + px.x * 0.03) * 0.0007;
    uv.x += wave;
  }

  vec3 col = texture(u_dom, uv).rgb;

  bool inBook = (px.x > 48.0 && px.x < 1872.0 && px.y > 40.0 && px.y < 955.0);
  if (inBook) {
    // 2. Physical Xuan Paper (Left) & Heavy Cardstock Fiber Grain (Right)
    float f1 = valueNoise(px * 0.35);
    float f2 = valueNoise(px * vec2(0.08, 0.45));
    float paperGrain = (f1 * 0.55 + f2 * 0.45) - 0.5;
    float grainStrength = (px.x < 960.0) ? 0.042 : 0.028;
    col += paperGrain * grainStrength;

    // 3. 3D Book-Spine Center Crease Shadow & Highlight around x = 960
    float dSpine = px.x - 960.0;
    float spineShadow = exp(-pow(dSpine / 22.0, 2.0)) * 0.19;
    float spineHighlight = exp(-pow((dSpine - 16.0) / 14.0, 2.0)) * 0.05;
    col = col * (1.0 - spineShadow) + vec3(1.0, 0.96, 0.88) * spineHighlight;

    // 4. Concentric Golden Sun & Origami Guiding Star ✦ Radial Warm Bloom
    float dSun = length(px - u_sunPos);
    float sunBloom = exp(-dSun / 240.0) * (0.14 + 0.03 * sin(u_time * 3.2));
    col += vec3(1.0, 0.84, 0.45) * sunBloom;

    float dStar = length(px - u_starPos);
    float starGlow = exp(-dStar / 46.0) * (0.34 + 0.1 * sin(u_time * 5.5));
    col += vec3(1.0, 0.92, 0.72) * starGlow;
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

  // Two Cinnabar Koi Fish (朱砂锦鲤) swimming around the White-Outline Ink Lotus
  const koi1X = 525 + 22 * Math.sin(sec * 2.2);
  const koi1Y = 588 - 8 * Math.cos(sec * 2.2);
  const koi1Rot = -18 + 5 * Math.cos(sec * 4.4);
  koi1.setAttribute(
    'transform',
    `translate(${koi1X.toFixed(2)}, ${koi1Y.toFixed(2)}) rotate(${koi1Rot.toFixed(2)})`
  );

  const koi2X = 418 - 18 * Math.sin(sec * 2.0 + 0.8);
  const koi2Y = 628 + 6 * Math.cos(sec * 2.0 + 0.8);
  const koi2Rot = 12 - 5 * Math.sin(sec * 4.0);
  koi2.setAttribute(
    'transform',
    `translate(${koi2X.toFixed(2)}, ${koi2Y.toFixed(2)}) rotate(${koi2Rot.toFixed(2)})`
  );

  const lotusSway = 2.5 * Math.sin(sec * 2.4);
  inkLotusFlower.setAttribute('transform', `translate(658, 558) rotate(${lotusSway.toFixed(2)})`);

  // 2. Right Spread (World 05 Pop-Up Paper Valley): Concentric Sun, Hanging Lanterns, Zoetrope & Cranes
  const s1 = 1.0 + 0.035 * Math.sin(sec * 3.6);
  const s2 = 1.0 + 0.025 * Math.sin(sec * 3.6 - 0.6);
  const s3 = 1.0 + 0.018 * Math.sin(sec * 3.6 - 1.2);
  sunR1.setAttribute('transform', `scale(${s1.toFixed(3)})`);
  sunR2.setAttribute('transform', `scale(${s2.toFixed(3)})`);
  sunR3.setAttribute('transform', `scale(${s3.toFixed(3)})`);

  const lanternAnchors = [
    [748, 50],
    [1192, 50],
    [1382, 50],
    [1558, 50],
    [1718, 50],
    [1085, 50],
  ];
  for (let i = 0; i < lanterns.length; i++) {
    const [ax, ay] = lanternAnchors[i];
    const ang = 2.6 * Math.sin(sec * 2.3 + i * 1.1);
    lanterns[i].setAttribute(
      'transform',
      `translate(${ax}, ${ay}) rotate(${ang.toFixed(2)}) translate(${-ax}, ${-ay})`
    );
  }

  const vaneShift = ((sec * 16) % 15) - 7.5;
  zoetropeInnerVane.setAttribute('transform', `translate(${vaneShift.toFixed(2)}, 0)`);

  // 3 Origami Cranes gliding in formation
  const pinkY = 386 + 11 * Math.sin(sec * 2.8);
  const pinkRot = -3 + 4 * Math.cos(sec * 2.8);
  cranePink.setAttribute(
    'transform',
    `translate(652, ${pinkY.toFixed(2)}) rotate(${pinkRot.toFixed(2)})`
  );

  const blueY = 376 + 11 * Math.sin(sec * 2.8 + 1.2);
  const blueRot = 3 - 4 * Math.cos(sec * 2.8 + 1.2);
  craneBlue.setAttribute(
    'transform',
    `translate(1268, ${blueY.toFixed(2)}) rotate(${blueRot.toFixed(2)})`
  );

  const goldCraneX = 915 + 14 * Math.sin(sec * 2.2);
  const goldCraneY = 485 + 10 * Math.cos(sec * 2.6);
  const goldCraneRot = -2 + 3 * Math.sin(sec * 2.6);
  heroCraneGoldGroup.setAttribute(
    'transform',
    `translate(${goldCraneX.toFixed(2)}, ${goldCraneY.toFixed(2)}) rotate(${goldCraneRot.toFixed(2)})`
  );

  // 5-Layer Die-Cut Pop-up Paper Pavilion & Terraced Pine Ridge subtle accordion pop-up breathing
  const popSpring = springStep(sec + 0.3, 0.25, 7.5);
  const popScaleY = 0.96 + 0.04 * clamp(popSpring.x, 0, 1.1) + 0.015 * Math.sin(sec * 3.0);
  popupTerracedPavilionGroup.setAttribute(
    'transform',
    `translate(1065, 648) scale(1.0, ${popScaleY.toFixed(4)})`
  );

  // 4. Origami 4-Faceted Guiding Star ✦ hovering at (960, 368)
  const starY = 368 + 7 * Math.cos(sec * 3.4);
  const starScale = 1.0 + 0.14 * Math.sin(sec * 5.2);
  const starRot = 8 * Math.sin(sec * 2.6);
  origamiGuidingStar.setAttribute(
    'transform',
    `translate(960, ${starY.toFixed(2)}) rotate(${starRot.toFixed(2)}) scale(${starScale.toFixed(3)})`
  );

  // 5. Sync DOM Paint -> Upload to WebGL2 -> Draw Fullscreen Shader
  await stage.syncAndUpload();

  const { gl, uniforms } = stage;
  gl.uniform2f(uniforms.u_res, canvas.width, canvas.height);
  gl.uniform1f(uniforms.u_time, sec);
  gl.uniform2f(uniforms.u_sunPos, 960.0, 282.0);
  gl.uniform2f(uniforms.u_starPos, 960.0, starY);
  stage.drawQuad();
};

await window.render(0.0);
window.READY = true;
</script>
</body>
</html>
