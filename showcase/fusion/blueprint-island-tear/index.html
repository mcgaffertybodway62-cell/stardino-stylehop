<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Blueprint Island Tear — HTML-in-Canvas × WebGL2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #071e3d;
    font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', monospace, sans-serif;
  }
  canvas#stage {
    width: 1920px;
    height: 1080px;
    display: block;
  }
  #dom-scene {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #08264c;
    user-select: none;
  }

  /* Right Isometric Macaron World */
  #iso-world {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #d7c6ee 0%, #e7d8f5 48%, #f8e4ee 100%);
  }

  /* Left Prussian Blue Cyanotype CAD World */
  #blueprint-world {
    position: absolute;
    inset: 0;
    background-color: #072247;
    background-image:
      radial-gradient(circle at 725px 540px, rgba(48, 138, 240, 0.28) 0%, rgba(10, 44, 86, 0.0) 52%),
      linear-gradient(rgba(130, 195, 255, 0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(130, 195, 255, 0.18) 1px, transparent 1px),
      linear-gradient(rgba(130, 195, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(130, 195, 255, 0.07) 1px, transparent 1px),
      linear-gradient(180deg, #0b3162 0%, #072247 55%, #051836 100%);
    background-size: 100% 100%, 120px 120px, 120px 120px, 24px 24px, 24px 24px, 100% 100%;
    background-position: 0 0, 36px 36px, 36px 36px, 36px 36px, 36px 36px, 0 0;
  }

  /* Authentic HTML CAD Title Block Table */
  .cad-title-block {
    position: absolute;
    left: 56px;
    bottom: 50px;
    width: 568px;
    border: 2px solid rgba(215, 238, 255, 0.92);
    background: rgba(6, 26, 54, 0.86);
    color: #e4f3ff;
    border-collapse: collapse;
    box-shadow: 0 0 24px rgba(66, 165, 245, 0.22);
    z-index: 5;
  }
  .cad-title-block td, .cad-title-block th {
    border: 1px solid rgba(175, 218, 255, 0.62);
    padding: 5px 10px;
    font-size: 12px;
    letter-spacing: 0.6px;
  }
  .cad-title-block .title-main {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1.2px;
    padding: 8px 12px;
  }
  .cad-title-block .title-num {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: #ffffff;
    width: 68px;
  }
  .cad-title-block .sub-row {
    font-size: 11px;
    color: #b7dcff;
    letter-spacing: 0.9px;
    padding: 4px 12px;
  }
  .cad-title-block .lbl {
    font-size: 10px;
    color: #84b9ef;
    display: block;
    margin-bottom: 2px;
  }
  .cad-title-block .val {
    font-size: 13px;
    color: #f0f8ff;
    font-weight: 600;
    text-align: right;
    display: block;
  }

  /* Animated Green [ BUILT ✓ ] Stamp */
  #built-stamp {
    position: absolute;
    left: 472px;
    bottom: 58px;
    padding: 5px 14px;
    border: 2.5px solid #39f7a2;
    border-radius: 4px;
    color: #39f7a2;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 2px;
    background: rgba(10, 48, 42, 0.85);
    box-shadow: 0 0 18px rgba(57, 247, 162, 0.45), inset 0 0 8px rgba(57, 247, 162, 0.25);
    transform-origin: center center;
    z-index: 10;
  }

  /* Section A-A Verified HUD Tag */
  #section-badge {
    position: absolute;
    left: 114px;
    top: 505px;
    color: #e6f4ff;
    z-index: 5;
  }
  #section-badge .sec-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.8px;
  }
  #section-badge .sec-sub {
    font-size: 13px;
    color: #b5dafb;
    margin-top: 3px;
  }
  #section-verified {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 700;
    color: #4df7ff;
    border: 1px solid #4df7ff;
    border-radius: 3px;
    background: rgba(16, 78, 110, 0.65);
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080" content="drawable" layoutsubtree>
  <div id="dom-scene" drawable>
    <!-- RIGHT HALF: 3D Low-Poly Macaron Floating Islands & Starlight Spire Citadel World -->
    <div id="iso-world">
      <svg id="iso-svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0;">
        <defs>
          <!-- Isometric 30-deg White Grid Pattern -->

          <!-- Starlight Pillar Gradient -->

            <stop offset="28%" stop-color="#ffe7a8" stop-opacity="0.55"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98"/>
            <stop offset="72%" stop-color="#ffe7a8" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#fff6d6" stop-opacity="0"/>

            <stop offset="50%" stop-color="#ffd57e"/>
            <stop offset="100%" stop-color="#e09f52"/>

            <stop offset="45%" stop-color="#ffd996" stop-opacity="0.45"/>

        <!-- Isometric Diamond Grid Background -->

        <!-- Right-side Pastel CAD Frame Border (Columns 4, 3, 2, 1 & Rows A, B, C, D) -->

          <line x1="1422" y1="18" x2="1422" y2="36" />

          <line x1="960" y1="1044" x2="960" y2="1062" />

          <line x1="1422" y1="1044" x2="1422" y2="1062" />

          <line x1="1884" y1="540" x2="1902" y2="540" />

        <g fill="#7c689b" font-size="12" font-weight="600" text-anchor="middle">

        <!-- ==================== ISLAND 2: UPPER-RIGHT ISLAND (cx=1708, cy=255) ==================== -->

          <g transform="translate(-32, -16)">

        <!-- ==================== ISLAND 3: BOTTOM ISLAND (cx=1218, cy=845) ==================== -->
        <g id="island-bottom" transform="translate(1218, 845)">
          <polygon points="-96,12 -36,32 0,104" fill="#5d4c7c"/>
          <polygon points="-36,32 36,32 0,104" fill="#726096"/>
          <polygon points="36,32 96,12 0,104" fill="#4b3c68"/>

            <line x1="122" y1="-16" x2="0" y2="-12"/>
            <line x1="122" y1="-16" x2="122" y2="52"/>

  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);

  // 2. Torn Blueprint Boundary: 3D Cast Shadow onto Right Isometric World + Deckle Edge Rim
  if (distToTear > 0.0 && distToTear < 46.0) {
    float shadowFactor = exp(-distToTear / 14.0) * 0.28;
    col *= (1.0 - shadowFactor);
  }
  float deckleGlow = exp(-pow(distToTear / 5.5, 2.0));
  col = mix(col, vec3(0.97, 0.99, 1.0), deckleGlow * 0.28);

  // 3. Right Isometric World: Luminous Starlight Pillar & Spire Beacon Bloom
  if (distToTear > -10.0) {
    float dStar = length(px - u_starPos);
    float starHalo = exp(-dStar / 54.0) * (0.26 + 0.08 * sin(u_time * 4.5));
    col += vec3(0.75, 0.58, 0.98) * starHalo;

    if (px.y < 545.0) {
      float dPillar = abs(px.x - 1485.0);
      float pGlow = exp(-dPillar / 28.0) * 0.12 * (0.85 + 0.15 * sin(u_time * 3.0 + px.y * 0.02));
      col += vec3(1.0, 0.92, 0.72) * pGlow;
    }
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

const stage = createDomShaderStage(canvas, domScene, FRAG_SOURCE, [
  'u_tearBase',
  'u_starPos',
]);

const blueprintWorld = document.getElementById('blueprint-world');
const tearPaperBand = document.getElementById('tear-paper-band');
const tearInnerLine = document.getElementById('tear-inner-line');
const tearOuterLine = document.getElementById('tear-outer-line');
const tearMarkers = document.getElementById('tear-markers');

const cadDialNeedle = document.getElementById('cad-dial-needle');
const cadCitadelStructure = document.getElementById('cad-citadel-structure');
const bpCompassStar = document.getElementById('bp-compass-star');
const sectionVerified = document.getElementById('section-verified');
const builtStamp = document.getElementById('built-stamp');

const compassStar3d = document.getElementById('compass-star-3d');
const spireOrbitRing = document.getElementById('spire-orbit-ring');
const citadelRingOuter = document.getElementById('citadel-ring-outer');
const islandMain = document.getElementById('island-main');
const islandMidTop = document.getElementById('island-mid-top');
const islandMidTopWire = document.getElementById('island-mid-top-wireframe');
const islandRightTop = document.getElementById('island-right-top');
const islandBottom = document.getElementById('island-bottom');

function tearCurveX(py, t, base) {
  return (
    base +
    14.0 * Math.sin(0.0135 * py + 1.15 * t) +
    7.5 * Math.sin(0.036 * py - 0.85 * t + 1.1) +
    4.0 * Math.cos(0.078 * py + 1.9 * t)
  );
}

function updateTearGeometry(t, tearBase) {
  const steps = 54;
  const dy = 1080 / steps;
  const innerPts = [];
  const outerPts = [];
  const clipPoly = ['0px 0px'];

  for (let i = 0; i <= steps; i++) {
    const y = i * dy;
    const x = tearCurveX(y, t, tearBase);
    const deckleW = 7.5 + 3.5 * Math.sin(0.09 * y + 1.7) + 2.0 * Math.cos(0.19 * y);
    innerPts.push([x, y]);
    outerPts.push([x + deckleW, y]);
    clipPoly.push(`${x.toFixed(1)}px ${y.toFixed(1)}px`);
  }
  clipPoly.push('0px 1080px');
  blueprintWorld.style.clipPath = `polygon(${clipPoly.join(',')})`;

  let bandD = `M ${innerPts[0][0].toFixed(1)} ${innerPts[0][1].toFixed(1)}`;
  let innerD = bandD;
  for (let i = 1; i < innerPts.length; i++) {
    const pt = `${innerPts[i][0].toFixed(1)} ${innerPts[i][1].toFixed(1)}`;
    bandD += ` L ${pt}`;
    innerD += ` L ${pt}`;
  }
  let outerD = `M ${outerPts[0][0].toFixed(1)} ${outerPts[0][1].toFixed(1)}`;
  for (let i = 1; i < outerPts.length; i++) {
    outerD += ` L ${outerPts[i][0].toFixed(1)} ${outerPts[i][1].toFixed(1)}`;
  }
  for (let i = outerPts.length - 1; i >= 0; i--) {
    bandD += ` L ${outerPts[i][0].toFixed(1)} ${outerPts[i][1].toFixed(1)}`;
  }
  bandD += ' Z';

  tearPaperBand.setAttribute('d', bandD);
  tearInnerLine.setAttribute('d', innerD);
  tearOuterLine.setAttribute('d', outerD);

  const markerYs = [84, 200, 316, 432, 548, 664, 780, 896, 1012];
  let markersHtml = '';
  for (const my of markerYs) {
    const mx = tearCurveX(my, t, tearBase) - 14;
    markersHtml += `<polygon points="${(mx - 7).toFixed(1)},${(my - 5).toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)} ${(mx - 7).toFixed(1)},${(my + 5).toFixed(1)}" />`;
  }
  tearMarkers.innerHTML = markersHtml;
}

window.render = async function (t) {
  const sec = clamp(t, 0, window.DUR);

  // 1. Dynamic Tear Boundary sweeping from x=1068 to x=968
  const tearProgress = smootherstep(0.1, 3.4, sec);
  const tearBase = lerp(1068, 968, tearProgress);
  updateTearGeometry(sec, tearBase);

  // 2. Left CAD Citadel Blueprint harmonic levitation pulse & rotating radar sweep
  const cadPulse = 1.0 + 0.025 * Math.sin(sec * 3.2);
  cadCitadelStructure.setAttribute('transform', `scale(${cadPulse.toFixed(4)})`);

  const dialAngle = -140 + sec * 52;
  cadDialNeedle.setAttribute('transform', `rotate(${dialAngle.toFixed(2)})`);

  const bpStarScale = 1.0 + 0.12 * Math.sin(sec * 5.0);
  bpCompassStar.setAttribute(
    'transform',
    `translate(0, -196) scale(${bpStarScale.toFixed(3)})`
  );

  // Section A-A Verified & Green [ BUILT ✓ ] Stamp animation
  const verAlpha = smootherstep(0.4, 1.2, sec);
  sectionVerified.style.opacity = verAlpha.toFixed(3);

  const stampSpring = springStep(Math.max(0, sec - 1.1), 0.24, 11.0);
  const stampVisible = sec >= 1.1 ? 1 : 0;
  const stampScale = stampVisible ? Math.max(0.01, 1.65 - 0.65 * stampSpring.x) : 0.01;
  builtStamp.style.opacity = smootherstep(1.05, 1.25, sec).toFixed(3);
  builtStamp.style.transform = `rotate(-6deg) scale(${stampScale.toFixed(3)})`;

  // 3. Right Isometric World: Floating Islands & Starlight Spire Citadel Bobbing
  const bobMain = 6.0 * Math.sin(sec * 2.1);
  const bobMid = 6.5 * Math.sin(sec * 2.4 + 1.1);
  const bobRight = 5.5 * Math.cos(sec * 2.0 + 0.6);
  const bobBot = 4.5 * Math.sin(sec * 2.6 + 2.2);

  islandMain.setAttribute('transform', `translate(1485, ${(548 + bobMain).toFixed(2)})`);
  islandMidTop.setAttribute('transform', `translate(1028, ${(255 + bobMid).toFixed(2)})`);
  islandMidTopWire.setAttribute('transform', `translate(1028, ${(255 + bobMid).toFixed(2)})`);
  islandRightTop.setAttribute('transform', `translate(1708, ${(255 + bobRight).toFixed(2)})`);
  islandBottom.setAttribute('transform', `translate(1218, ${(845 + bobBot).toFixed(2)})`);

  // Harmonic Rings & Compass-Star ✦ Beacon at Spire Apex
  const ringScale = 1.0 + 0.1 * Math.sin(sec * 4.2);
  citadelRingOuter.setAttribute('transform', `scale(${ringScale.toFixed(3)})`);
  spireOrbitRing.setAttribute(
    'transform',
    `translate(1485, ${(340 + bobMain).toFixed(2)}) scale(${(1.0 + 0.12 * Math.cos(sec * 4.2)).toFixed(3)}) translate(-1485, ${(-340 - bobMain).toFixed(2)})`
  );

  const starY = 295 + bobMain + 6 * Math.sin(sec * 3.8);
  const starScale = 1.0 + 0.16 * Math.sin(sec * 6.0);
  compassStar3d.setAttribute(
    'transform',
    `translate(1485, ${starY.toFixed(2)}) scale(${starScale.toFixed(3)})`
  );

  // 4. Sync DOM Paint -> Upload to WebGL2 Texture -> Draw Shader Quad
  await stage.syncAndUpload();

  const { gl, uniforms } = stage;
  gl.uniform2f(uniforms.u_res, canvas.width, canvas.height);
  gl.uniform1f(uniforms.u_time, sec);
  gl.uniform1f(uniforms.u_tearBase, tearBase);
  gl.uniform2f(uniforms.u_starPos, 1485.0, starY);
  stage.drawQuad();
};

await window.render(0.0);
window.READY = true;
</script>
</body>
